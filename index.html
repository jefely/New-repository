// 一页 A4 的月度报告
function printMonthlyReport() {
  const r = getCurrentRange();
  const [y, m] = (r.start || todayISO()).split('-').map(Number);
  const period = summaryMode === 'month'
    ? summaryMonth.year + ' 年 ' + summaryMonth.month + ' 月'
    : r.start + ' ~ ' + r.end;

  // 按分类汇总
  const catsOrder = ['资产类', '负债类', '收入类', '权益类', '费用类'];
  const byCat = {};
  for (const a of state.accounts) {
    const c = a.cat || '未分类';
    (byCat[c] = byCat[c] || { n: 0, bal: 0, out: 0, inn: 0, open: 0 });
    const st = computeStats(a, r);
    byCat[c].n++;
    byCat[c].bal += st.balance;
    byCat[c].out += st.mOut;
    byCat[c].inn += st.mIn;
    byCat[c].open += Number(a.opening) || 0;
  }
  const cats = Object.keys(byCat).sort((a, b) => {
    const ia = catsOrder.indexOf(a), ib = catsOrder.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

  let totIn = 0, totOut = 0, totAsset = 0, totDebt = 0;
  for (const c of cats) {
    const d = byCat[c];
    totIn += d.inn; totOut += d.out;
    if (c === '负债类') totDebt += d.bal; else totAsset += d.bal;
  }
  const net = totAsset - totDebt;

  // 本期流水（限 60 笔，避免撑爆纸）
  const txs = state.transactions
    .filter(t => t.date && t.date >= r.start && t.date <= r.end)
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  const shown = txs.slice(0, 60);

  const rows = cats.map(c => {
    const d = byCat[c];
    return '<tr><td>' + _prEsc(c) + '</td><td class="center">' + d.n + '</td>'
      + '<td class="num">' + _prMoney(d.inn) + '</td>'
      + '<td class="num">' + _prMoney(d.out) + '</td>'
      + '<td class="num">' + _prMoney(d.bal) + '</td></tr>';
  }).join('');

  const txRows = shown.map((t, i) =>
    '<tr><td class="center">' + (i + 1) + '</td><td class="center">' + _prEsc(toYYMMDD(t.date)) + '</td>'
    + '<td>' + _prEsc(t.from) + '</td><td>' + _prEsc(t.to) + '</td>'
    + '<td class="num">' + _prMoney(t.amount) + '</td><td>' + _prEsc(t.note) + '</td></tr>'
  ).join('');

  const html = '<h1>流水账 · 月度报告</h1>'
    + '<div class="meta">统计区间：' + _prEsc(period) + '（' + _prEsc(r.start) + ' ~ ' + _prEsc(r.end) + '）'
    + ' · 账户 ' + state.accounts.length + ' 个 · 本期流水 ' + txs.length + ' 笔</div>'

    + '<h2>总览</h2>'
    + '<div class="kv">'
    + '<div>本期收入<b>' + _prMoney(totIn) + '</b></div>'
    + '<div>本期支出<b>' + _prMoney(totOut) + '</b></div>'
    + '<div>本期结余<b>' + _prMoney(totIn - totOut) + '</b></div>'
    + '<div>资产<b>' + _prMoney(totAsset) + '</b></div>'
    + '<div>负债<b>' + _prMoney(totDebt) + '</b></div>'
    + '<div>净资产<b>' + _prMoney(net) + '</b></div>'
    + '</div>'

    + '<h2>分类汇总</h2>'
    + '<table><thead><tr><th>分类</th><th>账户数</th><th>转入</th><th>转出</th><th>结余</th></tr></thead><tbody>'
    + rows
    + '<tr class="total-row"><td>合计</td><td class="center">' + state.accounts.length + '</td>'
    + '<td class="num">' + _prMoney(totIn) + '</td><td class="num">' + _prMoney(totOut) + '</td>'
    + '<td class="num">' + _prMoney(net) + '</td></tr>'
    + '</tbody></table>'

    + (shown.length ? ('<h2>本期流水' + (txs.length > shown.length ? '（前 ' + shown.length + ' 笔，共 ' + txs.length + ' 笔）' : '') + '</h2>'
      + '<table><thead><tr><th>序号</th><th>日期</th><th>转出</th><th>转入</th><th>金额</th><th>备注</th></tr></thead><tbody>'
      + txRows + '</tbody></table>') : '')

    + '<div class="foot">打印时间 ' + new Date().toLocaleString('zh-CN') + '</div>';

  _prGo(html);
}

  const byCat = {};
  for (const a of state.accounts) {
    const c = a.cat || '未分类';
    (byCat[c] = byCat[c] || []).push(a);
  }
  const cats = Object.keys(byCat).sort((a, b) => {
    const ia = catsOrder.indexOf(a), ib = catsOrder.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  let idx = 1, grand = 0;
  let body = '';
  for (const c of cats) {
    let sub = 0;
    const rows = byCat[c].map(a => {
      const st = computeStats(a, r);
      sub += st.balance;
      const isDebt = (a.cat || '') === '负债类';
      return '<tr><td class="center">' + (idx++) + '</td><td>' + _prEsc(c) + '</td>'
        + '<td class="center">' + _prEsc(a.code) + '</td><td>' + _prEsc(a.name) + '</td>'
        + '<td class="num">' + _prMoney(st.balance) + '</td>'
        + '<td class="num">' + _prMoney(a.opening) + '</td>'
        + '<td class="center">' + (isDebt ? _prEsc(a.billDay) : '') + '</td>'
        + '<td class="center">' + (isDebt ? _prEsc(a.repayDay) : '') + '</td></tr>';
    }).join('');
    body += rows;
    body += '<tr class="total-row"><td colspan="4">' + _prEsc(c) + ' 合计</td>'
      + '<td class="num">' + _prMoney(sub) + '</td><td colspan="3"></td></tr>';
    grand += sub;
  }
  const html = '<h1>流水账 · 账户余额表</h1>'
    + '<div class="meta">统计区间：' + _prEsc(summaryMode === 'month' ? (summaryMonth.year + ' 年 ' + summaryMonth.month + ' 月') : (r.start + ' ~ ' + r.end))
    + ' · 账户 ' + state.accounts.length + ' 个</div>'
    + '<table><thead><tr><th>序号</th><th>分类</th><th>简码</th><th>账户名称</th><th>当前结余</th><th>期初</th><th>账单日</th><th>还款日</th></tr></thead><tbody>'
    + body
    + '<tr class="total-row"><td colspan="4">全部合计</td><td class="num">' + _prMoney(grand) + '</td><td colspan="3"></td></tr>'
    + '</tbody></table>'
    + '<div class="foot">打印时间 ' + new Date().toLocaleString('zh-CN') + '</div>';
  _prGo(html);
}



/* ============================================================
   固定支出
   ------------------------------------------------------------
   数据：state.fixed = [{ id, day, from, to, amount, note, sourceTxId, lastMonth }]
   · day        每月几号触发（取自添加时那笔流水的日）
   · lastMonth  最近一次自动写入的月份（'YYYY-MM'），防止同月重复写
   · sourceTxId 来源流水 id；取消勾选时按它找回
   触发规则：当天 >= day，且 lastMonth 不是本月 → 写入一笔（日期用当天）
   每天只在 5:00 之后检查一次（localStorage 记日期）
   ============================================================ */
const FIXED_RUN_KEY = 'flow_fixed_lastrun_v1';


// 给一行流水挂上「固定支出」勾选框（幂等）
function attachFixedCheckbox(tr) {
  if (!tr || !tr.dataset.id) return;
  const noteTd = tr.querySelector('td.col-note');
  if (!noteTd || noteTd.querySelector('.fixed-chk')) return;
  const chk = document.createElement('input');
  chk.type = 'checkbox';
  chk.className = 'fixed-chk';
  chk.title = '加入固定支出（每月按这一天的金额自动记一笔）';
  chk.checked = !!fixedBySource(tr.dataset.id);
  chk.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (chk.checked) addFixedFromTx(tr.dataset.id);
    else removeFixedBySource(tr.dataset.id);
    save();
    toast(chk.checked ? '已加入固定支出' : '已取消固定支出');
  });
  noteTd.appendChild(chk);
}

function fixedBySource(txId) {
  return (state.fixed || []).find(f => f.sourceTxId === txId) || null;
}

// 从一笔流水创建固定支出（勾选）
function addFixedFromTx(txId) {
  const t = state.transactions.find(x => x.id === txId);
  if (!t) return;
  if (fixedBySource(txId)) return;
  const day = t.date ? parseInt(t.date.slice(8, 10), 10) : 1;
  state.fixed.push({
    id: 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    day: day || 1,
    from: t.from || '',
    to: t.to || '',
    amount: t.amount === '' || t.amount == null ? '' : t.amount,
    note: t.note || '',
    sourceTxId: txId,
    lastMonth: ''
  });
}

// 取消勾选（按来源流水）
function removeFixedBySource(txId) {
  state.fixed = (state.fixed || []).filter(f => f.sourceTxId !== txId);
}

// 打开时自动写入：当天 >= day 且本月还没写过
function runFixedExpenses() {
  if (!state.fixed || !state.fixed.length) return 0;
  const now = new Date();
  const hh = now.getHours();
  if (hh < 5) return 0;                       // 5:00 之前不触发
  const today = todayISO();
  const day = now.getDate();
  const ym = today.slice(0, 7);               // '2026-10'

  let ranToday = false;
  try { ranToday = localStorage.getItem(FIXED_RUN_KEY) === today; } catch (e) {}
  if (ranToday) return 0;                     // 今天已经跑过

  let added = 0;
  for (const f of state.fixed) {
    if (day < (f.day || 1)) continue;         // 还没到这个月的那天
    if (f.lastMonth === ym) continue;         // 本月已经写过
    state.transactions.push({
      id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + (added++),
      seq: 0,
      date: today,                            // 日期用当天
      from: f.from || '',
      to: f.to || '',
      amount: f.amount === '' || f.amount == null ? '' : f.amount,
      note: f.note || '',
      fixedId: f.id
    });
    f.lastMonth = ym;
  }
  try { localStorage.setItem(FIXED_RUN_KEY, today); } catch (e) {}
  if (added) { reseq(); save(); }
  return added;
}

// 固定支出列表页
function renderFixed(main, footer) {
  const list = (state.fixed || []).slice().sort((a, b) => (a.day || 1) - (b.day || 1));
  // 收入/支出合计：按 from 账户的分类判断 —— from 属于收入类算收入，其余算支出
  const catOf = (name) => {
    const a = state.accounts.find(x => (x.name || '').trim() === String(name || '').trim());
    return a ? String(a.cat || '') : '';

  let sumIn = 0, sumOut = 0;

        tr.appendChild(td);
      });

      del.type = 'button';
      del.className = 'row-del';

  initColResize(table, 'fixed');

function parseBookTXT(text) {
  text = String(text).replace(/\r\n?/g, '\n');
  const txs = [], accs = [];
  let section = null;
  for (const raw of text.split('\n')) {
    // 只去掉行尾空格，不能连 tab 一起去 —— tab 分隔的文件末尾空字段会被吃掉，列数就不对了
    const line = raw.replace(/[ ]+$/, '');
    if (!line.trim()) continue;
    const mh = line.match(/^\[(.+?)\]$/);
    if (mh) { section = mh[1].trim() === '流水' ? 'tx' : mh[1].trim() === '账户' ? 'acc' : null; continue; }
    // tab 优先判定：原来先看有没有全角逗号，导致 tab 分隔的文件只要备注里带逗号就整行错位
    const sep = line.indexOf('\t') >= 0 ? '\t' : (line.indexOf('，') >= 0 ? '，' : ',');
    const cols = splitEscaped(line, sep);

    if (section === 'tx') {
      const date = parseDateInput(cols[0] || ''), from = (cols[1] || '').trim(), to = (cols[2] || '').trim(), amt = parseFloat(cols[3]), note = (cols[4] || '').trim();
      if (date || from || to || !isNaN(amt)) txs.push({ id: uid(), date: date || todayISO(), from, to, amount: isNaN(amt) ? '' : amt, note });
    } else if (section === 'acc') {
      // 第一列是纯数字就当序号剥掉（分类是中文，不会撞车）；旧的 6 列文件没有序号，原样读
      const c = /^\d+$/.test((cols[0] || '').trim()) ? cols.slice(1) : cols;
      const cat = (c[0] || '').trim(), code = (c[1] || '').trim(), name = (c[2] || '').trim();
      const op = parseFloat(c[3]) || 0, billDay = (c[4] || '').trim(), repayDay = (c[5] || '').trim();
      if (cat || code || name) accs.push({ id: uid(), cat: cat || '资产类', code, name, opening: op, billDay, repayDay });
    }
  }
  return { txs, accs };
}

/* 导入：账户段「全部替换」，流水段「追加」—— 两段各自独立，只带其中一段的文件也能用。 */
function importAllTXT(e, footer) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const { txs, accs } = parseBookTXT(r.result);
      if (!accs.length && !txs.length) return toast('TXT 里没有可识别的数据', { type: 'error' });
      const prevAccs = state.accounts, prevTxs = state.transactions;
      const msg = [];

      if (accs.length) {
        state.accounts = accs;
        msg.push(`账户 ${prevAccs.length} → ${accs.length} 个（替换）`);
      }
      if (txs.length) {
        const before = state.transactions.length;
        state.transactions = state.transactions.concat(txs.map(t => ({ ...t, seq: 0 })));
        reseq();
        msg.push(`流水追加 ${txs.length} 笔（${before} → ${state.transactions.length}）`);
      }
      save(); render();
      toast(`已导入：${msg.join('，')}`, {
        action: {
          label: '撤销',
          onClick: () => { state.accounts = prevAccs; state.transactions = prevTxs; save(); render(); toast('已撤销导入'); }
        }
      });
    } catch (err) { toast('导入失败：' + err.message, { type: 'error' }); }
    finally { e.target.value = ''; }
  };
  r.readAsText(f, 'utf-8');
}

/* ============================================================
   跨设备同步码 (Sync Code)
   ------------------------------------------------------------
   把全部数据压成一段文本，任意设备之间可搬运（微信发、复制粘贴都行）。
   格式： LZ1:base64(gzip(JSON))  —— 浏览器不支持 CompressionStream 时退回 LZ0:base64(JSON)
   语义是「快照覆盖」：粘贴别人的码 = 用对方的数据替换本机（带确认）。
   ============================================================ */
function bytesToB64(bytes) {
  let s = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function b64ToBytes(b64) {
  const norm = b64.replace(/-/g, '+').replace(/_/g, '/');
  const pad = norm.length % 4 ? '='.repeat(4 - norm.length % 4) : '';
  const bin = atob(norm + pad);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function syncEncodeText(text) {
  const bytes = new TextEncoder().encode(text);
  if (typeof CompressionStream === 'function') {
    try {
      const cs = new CompressionStream('gzip');
      const w = cs.writable.getWriter();
      w.write(bytes); w.close();
      const buf = await new Response(cs.readable).arrayBuffer();
      return 'LZ1:' + bytesToB64(new Uint8Array(buf));
    } catch (e) { /* 掉到下面的未压缩分支 */ }
  }
  return 'LZ0:' + bytesToB64(bytes);
}

async function syncDecodeText(code) {
  const s = String(code || '').trim();
  const m = s.match(/^(LZ[01])[:：]\s*([\s\S]+)$/i);
  if (!m) throw new Error('格式不对，同步码应该以 LZ1: 或 LZ0: 开头');
  const kind = m[1].toUpperCase();
  const bytes = b64ToBytes(m[2].replace(/\s+/g, ''));
  if (kind === 'LZ0') return new TextDecoder().decode(bytes);
  if (typeof DecompressionStream !== 'function') throw new Error('这个浏览器不支持解压，请用新版 Chrome / Edge');
  const ds = new DecompressionStream('gzip');
  const w = ds.writable.getWriter();
  w.write(bytes); w.close();
  return await new Response(ds.readable).text();
}

// 生成同步码
async function buildSyncCode() {
  const payload = {
    v: 1,
    at: new Date().toISOString(),
    accounts: state.accounts,
    transactions: state.transactions,
    installments: state.installments || []
  };
  return await syncEncodeText(JSON.stringify(payload));
}

// 解析并套用同步码
async function applySyncCode(code) {
  const json = await syncDecodeText(code);
  const data = JSON.parse(json);
  if (!data || !Array.isArray(data.accounts) || !Array.isArray(data.transactions)) {
    throw new Error('这段码里没有可识别的账本数据');
  }
  state.accounts = data.accounts;
  state.transactions = data.transactions;
  state.installments = Array.isArray(data.installments) ? data.installments : [];
  reseq(); save(); render();
  return { accounts: state.accounts.length, transactions: state.transactions.length, installments: state.installments.length };
}


// ===== 导出：把当前数据填进模板，保留 VBA =====
async function exportXLSM() {
  const b64 = getXlsmTemplate();
  if (!b64) { toast('还没有 Excel 模板，请先在「Excel」里上传一次 .xlsm 模板', { type: 'error', duration: 5000 }); return; }
  const bin = _b64ToBytes(b64);
  const { map, order } = await xlsmUnzip(bin.buffer.slice(bin.byteOffset, bin.byteOffset + bin.byteLength));
  const shared = _xShared(map);
  const paths = _xFindSheets(map);

  // --- 流水表：保留 r1（标题）r2（表头），r3 起写数据 ---
  const flowXml = _xdec.decode(map.get(paths.flow));
  const flowRows = _xParseSheet(flowXml, shared);
  const flowStyle = (col) => {
    const base = flowRows.get(3) || [];
    const cn = _xColName(col);
    const hit = base.find(c => c.col === cn);
    return hit ? hit.s : null;
  };
  const flowData = state.transactions.slice().sort((a, b) => (a.seq || 0) - (b.seq || 0)).map((t, i) => {
    const ser = t.date ? _xSerial(t.date) : null;
    return [
      [1, String(i + 1), true],
      [2, ser == null ? '' : String(ser), true],
      [3, t.from || '', false],
      [4, t.to || '', false],
      [5, t.amount === '' || t.amount == null ? '' : Number(t.amount).toFixed(2), true],
      [6, t.note || '', false]
    ];
  });
  const newFlowXml = _xRebuild(flowXml, 2, flowData, flowStyle);

  // --- 汇总表：保留 r1（起止日期/标题）r2（表头），r3 起写账户 ---
  const sumXml = _xdec.decode(map.get(paths.sum));
  const sumRows = _xParseSheet(sumXml, shared);
  const sumStyle = (col) => {
    const base = sumRows.get(3) || [];
    const cn = _xColName(col);
    const hit = base.find(c => c.col === cn);
    return hit ? hit.s : null;
  };
  const accData = state.accounts.map((a, i) => {
    const isDebt = (a.cat || '') === '负债类';
    const row = [
      [1, String(i + 1), true],
      [2, a.cat || '', false],
      [3, a.code || '', false],
      [4, a.name || '', false],
      [10, String(Number(a.opening || 0).toFixed(2)), true]
    ];
    if (isDebt) { row.push([12, a.billDay || '', false]); row.push([13, a.repayDay || '', false]); }
    return row;
  });
  // 把 r1 里的年/月也更新成本次导出的
  let sumHead = sumXml;
  const newSumXml = _xRebuild(sumHead, 2, accData, sumStyle);

  // --- 重新打包：替换两张表 + 强制重算 ---
  const outEntries = order.map(e => {
    if (e.name === paths.flow) return { name: e.name, data: _xenc.encode(newFlowXml) };
    if (e.name === paths.sum) return { name: e.name, data: _xenc.encode(newSumXml) };
    if (e.name === 'xl/workbook.xml') {
      let wb = _xdec.decode(e.data);
      if (!/fullCalcOnLoad/.test(wb)) wb = wb.replace(/<calcPr([^>]*)\/>/, '<calcPr$1 fullCalcOnLoad="1"/>');
      return { name: e.name, data: _xenc.encode(wb) };
    }
    return e;
  });
  const out = await xlsmZip(outEntries);
  const name = '流水账_' + todayISO() + '.xlsm';
  const blob = new Blob([out], { type: 'application/vnd.ms-excel.sheet.macroEnabled.12' });
  try {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      toast('已生成 .xlsm（含 VBA），通过系统分享保存');
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('已导出 ' + name + '（含 VBA）');
}

// ===== 导入：读 .xlsm → 覆盖当前数据 =====
async function readXLSMFile(file) {
  const bin = new Uint8Array(await file.arrayBuffer());
  const { map } = await xlsmUnzip(bin.buffer.slice(bin.byteOffset, bin.byteOffset + bin.byteLength));
  const shared = _xShared(map);
  const paths = _xFindSheets(map);

  // 汇总表 → 账户。表头在 r2，数据从 r3 起；遇到空行（A 列没有序号）就跳过
  const sumRows = _xParseSheet(_xdec.decode(map.get(paths.sum)), shared);
  const accs = [];
  const colOf = (cells, name) => {
    const idx = (sumHeader || []).indexOf(name);
    return idx < 0 ? null : (cells.find(c => c.col === _xColName(idx + 1)) || {}).v;
  };
  const sumHeader = [];
  (sumRows.get(2) || []).forEach(c => {
    let i = 0, n = 0;
    for (const ch of c.col) n = n * 26 + (ch.charCodeAt(0) - 64);
    i = n - 1;
    sumHeader[i] = c.v;
  });
  for (const [r, cells] of [...sumRows.entries()].sort((a, b) => a[0] - b[0])) {
    if (r <= 2) continue;
    const name = colOf(cells, '账户名称');
    if (!name) continue;
    accs.push({
      id: 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      cat: colOf(cells, '分类') || '',
      code: colOf(cells, '简码') || '',
      name,
      opening: colOf(cells, '期初') || '',
      billDay: colOf(cells, '账单日') || '',
      repayDay: colOf(cells, '还款日') || ''
    });
  }

  // 流水表 → 交易。表头在 r2，数据从 r3 起
  const flowRows = _xParseSheet(_xdec.decode(map.get(paths.flow)), shared);
  const flowHeader = [];
  (flowRows.get(2) || []).forEach(c => {
    let n = 0;
    for (const ch of c.col) n = n * 26 + (ch.charCodeAt(0) - 64);
    flowHeader[n - 1] = c.v;
  });
  const tx = [];
  let seq = 0;
  for (const [r, cells] of [...flowRows.entries()].sort((a, b) => a[0] - b[0])) {
    if (r <= 2) continue;
    const val = (name) => {
      const idx = flowHeader.indexOf(name);
      if (idx < 0) return '';
      const hit = cells.find(c => c.col === _xColName(idx + 1));
      return hit ? hit.v : '';
    };
    const dateRaw = val('日期'), from = val('转出账户'), to = val('转入账户'), amt = val('金额'), note = val('备注');
    if (!dateRaw && !from && !to && !amt && !note) continue;
    seq++;
    tx.push({
      id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      seq,
      date: dateRaw ? (/^\d+(\.\d+)?$/.test(dateRaw) ? _xFromSerial(dateRaw) : dateRaw) : '',
      from, to,
      amount: amt === '' ? '' : Number(amt),
      note
    });
  }
  return { accounts: accs, transactions: tx };
}


/* ============================================================
   导出纯数据 .xlsx（不带宏，避免安全警告）
   ------------------------------------------------------------
   最小 OOXML：Content_Types + rels + workbook + 3 张 sheet + styles
   字符串用 inlineStr，不维护 sharedStrings；三种单元格样式：
   s=0 文本 / s=1 日期(numFmt 14) / s=2 金额(#,##0.00)
   ============================================================ */
/* ============================================================
   导出 .xlsx（尽力还原网页观感）
   ------------------------------------------------------------
   · 手写最小 OOXML，浏览器原生 deflate 压缩，零依赖
   · 样式：深色表头 + 白字、斑马纹、细边框、冻结前两行
   · 三种数据类型：文本(inlineStr) / 日期(真日期) / 金额(#,##0.00)
   ============================================================ */

// ---- 配色（对齐网页变量）----
const XC = {
  dark: 'FF1E293B',   // --bg-dark，表头/分组行
  gray: 'FFF8FAFC',   // --bg-gray-light，斑马纹
  white: 'FFFFFFFF',
  border: 'FFCBD5E1',
  text: 'FF0F172A',
  muted: 'FF64748B',
  accent: 'FF2563EB'
};

// ---- style 索引表：每种“数据类型 × 是否斑马纹”一个 ----
// 0 默认  1 标题  2 表头  3 表头右对齐
// 10 左  11 中  12 右(金额)  13 日期  14 分组文本  15 分组金额  16 合计右
// 20..26 是 10..16 的斑马纹版本
const XS = {
  default: 0, title: 1, head: 2, headRight: 3, titleDate: 4, int: 17, zInt: 24,
  left: 10, center: 11, money: 12, date: 13, groupText: 14, groupMoney: 15, total: 16,
  zLeft: 20, zCenter: 21, zMoney: 22, zDate: 23
};

function _xlsxNumFmts() {
  return '<numFmts count="2">'
    + '<numFmt numFmtId="164" formatCode="yyyy-mm-dd"/>'
    + '<numFmt numFmtId="165" formatCode="#,##0.00;-#,##0.00;&quot;&quot;"/>'
    + '</numFmts>';
}
function _xlsxFonts() {
  return '<fonts count="4">'
    + '<font><sz val="11"/><color rgb="' + XC.text + '"/><name val="微软雅黑"/><charset val="134"/></font>'
    + '<font><b/><sz val="11"/><color rgb="' + XC.text + '"/><name val="微软雅黑"/><charset val="134"/></font>'
    + '<font><b/><sz val="14"/><color rgb="' + XC.text + '"/><name val="微软雅黑"/><charset val="134"/></font>'
    + '<font><b/><sz val="11"/><color rgb="' + XC.white + '"/><name val="微软雅黑"/><charset val="134"/></font>'
    + '</fonts>';
}
function _xlsxFills() {
  return '<fills count="4">'
    + '<fill><patternFill patternType="none"/></fill>'
    + '<fill><patternFill patternType="gray125"/></fill>'
    + '<fill><patternFill patternType="solid"><fgColor rgb="' + XC.dark + '"/><bgColor indexed="64"/></patternFill></fill>'
    + '<fill><patternFill patternType="solid"><fgColor rgb="' + XC.gray + '"/><bgColor indexed="64"/></patternFill></fill>'
    + '</fills>';
}
function _xlsxBorders() {
  return '<borders count="2">'
    + '<border><left/><right/><top/><bottom/><diagonal/></border>'
    + '<border>'
    + '<left style="thin"><color rgb="' + XC.border + '"/></left>'
    + '<right style="thin"><color rgb="' + XC.border + '"/></right>'
    + '<top style="thin"><color rgb="' + XC.border + '"/></top>'
    + '<bottom style="thin"><color rgb="' + XC.border + '"/></bottom>'
    + '<diagonal/></border>'
    + '</borders>';
}
// 一个 xf 的快捷拼装
function _xf(fontId, fillId, borderId, numFmtId, opts) {
  opts = opts || {};
  const al = opts.align
    ? '<alignment horizontal="' + opts.align + '" vertical="' + (opts.valign || 'center')
      + '"' + (opts.wrap ? ' wrapText="1"' : '') + '/>'
    : '';
  return '<xf numFmtId="' + numFmtId + '" fontId="' + fontId + '" fillId="' + fillId
    + '" borderId="' + borderId + '" xfId="0"'
    + (numFmtId ? ' applyNumberFormat="1"' : '')
    + (fontId ? ' applyFont="1"' : '')
    + (fillId > 1 ? ' applyFill="1"' : '')
    + (borderId ? ' applyBorder="1"' : '')
    + (al ? ' applyAlignment="1"' : '') + '>'
    + al + '</xf>';
}
function _xlsxCellXfs() {
  const P = '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>';
  const list = [];
  const put = (idx, xml) => { while (list.length < idx) list.push(P); list[idx] = xml; };

  put(0, P);                                                              // 默认
  put(1, _xf(3, 2, 1, 0, { align: 'center' }));                           // 标题（深底白字）
  put(2, _xf(3, 2, 1, 0, { align: 'center', wrap: true }));               // 表头
  put(3, _xf(3, 2, 1, 0, { align: 'right' }));                            // 表头右
  put(4, _xf(3, 2, 1, 164, { align: 'center' }));                         // 标题里的日期
  put(10, _xf(0, 0, 1, 0, { align: 'left' }));                            // 文本左
  put(11, _xf(0, 0, 1, 0, { align: 'center' }));                          // 文本中
  put(12, _xf(0, 0, 1, 165, { align: 'right' }));                         // 金额
  put(13, _xf(0, 0, 1, 164, { align: 'center' }));                        // 日期
  put(14, _xf(3, 2, 1, 0, { align: 'left' }));                            // 分组文本（深底白字）
  put(15, _xf(3, 2, 1, 165, { align: 'right' }));                         // 分组金额
  put(16, _xf(1, 3, 1, 165, { align: 'right' }));                         // 合计
  put(17, _xf(0, 0, 1, 1, { align: 'center' }));                          // 序号（整数）
  put(20, _xf(0, 3, 1, 0, { align: 'left' }));                            // 斑马-左
  put(21, _xf(0, 3, 1, 0, { align: 'center' }));                          // 斑马-中
  put(22, _xf(0, 3, 1, 165, { align: 'right' }));                         // 斑马-金额
  put(23, _xf(0, 3, 1, 164, { align: 'center' }));                        // 斑马-日期
  put(24, _xf(0, 3, 1, 1, { align: 'center' }));                          // 斑马-序号
  for (let k = 0; k < list.length; k++) if (!list[k]) list[k] = P;
  return '<cellXfs count="' + list.length + '">' + list.join('') + '</cellXfs>';
}
function _xlsxStyles() {
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + _xlsxNumFmts() + _xlsxFonts() + _xlsxFills() + _xlsxBorders()
    + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    + _xlsxCellXfs()
    + '<cellStyles count="1"><cellStyle name="常规" xfId="0" builtinId="0"/></cellStyles>'
    + '</styleSheet>';
}

// 单元格：k = str / center / num / date / int ；z = 是否斑马纹
function _xlsxCell(ref, v, k, sIdx) {
  if (v === '' || v == null) {
    // 空值也要画边框，否则表格缺一块
    return sIdx == null ? '' : '<c r="' + ref + '" s="' + sIdx + '"/>';
  }
  if (k === 'num' || k === 'int') {
    const n = Number(v);
    if (isFinite(n)) return '<c r="' + ref + '" s="' + sIdx + '"><v>' + n + '</v></c>';
  }
  if (k === 'date') {
    const ser = _xSerial(v);
    if (ser != null) return '<c r="' + ref + '" s="' + sIdx + '"><v>' + ser + '</v></c>';
  }
  return '<c r="' + ref + '" s="' + sIdx + '" t="inlineStr"><is><t xml:space="preserve">' + _xEsc(String(v)) + '</t></is></c>';
}

// rows: [{ cells:[{v,k}], h:行高, kind:'title'|'head'|'data'|'group'|'total', zebra:bool }]
function _xlsxSheetXml(sheet) {
  const rows = sheet.rows;
  const widths = sheet.widths || [];
  const freeze = sheet.freeze == null ? 0 : sheet.freeze;
  const head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"'
    + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';
  let views = '<sheetViews><sheetView workbookViewId="0"';
  views += freeze > 0 ? ' tabSelected="1"' : '';
  views += '>';
  if (freeze > 0) {
    views += '<pane ySplit="' + freeze + '" topLeftCell="A' + (freeze + 1) + '" activePane="bottomLeft" state="frozen"/>';
  }
  views += '</sheetView></sheetViews>';
  let cols = '';
  if (widths.length) {
    cols = '<cols>' + widths.map((w, i) =>
      '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>';
  }
  const body = rows.map((row, ri) => {
    const r = ri + 1;
    const kind = row.kind || 'data';
    const zebra = !!row.zebra && kind === 'data';
    const parts = row.cells.map((cell, ci) => {
      const k = cell.k || 'str';
      let s;
      if (kind === 'title') s = (k === 'date' ? XS.titleDate : XS.title);
      else if (kind === 'head') s = (k === 'num' ? XS.headRight : XS.head);
      else if (kind === 'group') s = (k === 'num' ? XS.groupMoney : XS.groupText);
      else if (kind === 'total') s = XS.total;
      else if (k === 'int') s = zebra ? XS.zInt : XS.int;
      else if (k === 'num') s = zebra ? XS.zMoney : XS.money;
      else if (k === 'date') s = zebra ? XS.zDate : XS.date;
      else if (k === 'center') s = zebra ? XS.zCenter : XS.center;
      else s = zebra ? XS.zLeft : XS.left;
      return _xlsxCell(_xColName(ci + 1) + r, cell.v, k, s);
    }).join('');
    const h = row.h ? ' ht="' + row.h + '" customHeight="1"' : '';
    return '<row r="' + r + '"' + h + '>' + parts + '</row>';
  }).join('');
  return head + views + cols + '<sheetData>' + body + '</sheetData></worksheet>';
}

// ---- 组装三张表 ----
async function buildXlsxBytes() {
  const sheets = [];

  // ===== 1. 流水 =====
  const flowRows = [];
  flowRows.push({ h: 30, kind: 'title', cells: [{ v: '流水记录', k: 'str' }] });
  flowRows.push({ h: 26, kind: 'head', cells: ['序号', '日期', '转出账户', '转入账户', '金额', '备注'].map(h => ({ v: h, k: 'str' })) });
  state.transactions.slice().sort((a, b) => (a.seq || 0) - (b.seq || 0)).forEach((t, i) => {
    flowRows.push({
      h: 22, kind: 'data', zebra: i % 2 === 0,
      cells: [
        { v: i + 1, k: 'int' },
        { v: t.date || '', k: 'date' },
        { v: t.from || '', k: 'center' },
        { v: t.to || '', k: 'center' },
        { v: t.amount === '' || t.amount == null ? '' : t.amount, k: 'num' },
        { v: t.note || '', k: 'str' }
      ]
    });
  });
  sheets.push({ name: '流水', rows: flowRows, widths: [7, 13, 20, 20, 14, 30], freeze: 2 });

  // ===== 2. 汇总（起止：今天往前推 1 年 → 今天）=====
  const today = todayISO();
  const endD = new Date(today + 'T00:00:00');
  const startD = new Date(endD.getFullYear() - 1, endD.getMonth(), endD.getDate());
  const startIso = startD.getFullYear() + '-' + pad2(startD.getMonth() + 1) + '-' + pad2(startD.getDate());
  const range = { start: startIso, end: today };

  const sumRows = [];
  sumRows.push({ h: 30, kind: 'title', cells: [
    { v: startIso, k: 'date' }, { v: '至', k: 'str' }, { v: today, k: 'date' },
    { v: '汇总表', k: 'str' }
  ] });
  sumRows.push({ h: 26, kind: 'head', cells: ['序号', '分类', '简码', '账户名称', '当前结余', '转出', '转入', '转出历史', '转入历史', '期初', '账单日', '还款日'].map((h, i) =>
    ({ v: h, k: i >= 4 && i <= 9 ? 'num' : 'str' })) });

  // 按分类分组，组头用深色行（和网页一致）
  const catsOrder = ['资产类', '负债类', '收入类', '权益类', '费用类'];
  const byCat = {};
  for (const a of state.accounts) { const c = a.cat || '未分类'; (byCat[c] = byCat[c] || []).push(a); }
  const cats = Object.keys(byCat).sort((a, b) => {
    const ia = catsOrder.indexOf(a), ib = catsOrder.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  let idx = 1, zebraToggle = 0;
  for (const cat of cats) {
    const list = byCat[cat];
    const st = { bal: 0, out: 0, inn: 0, hout: 0, hin: 0, open: 0 };
    for (const a of list) {
      const s = computeStats(a, range);
      st.bal += s.balance; st.out += s.mOut; st.inn += s.mIn; st.hout += s.hOut; st.hin += s.hIn;
      st.open += Number(a.opening) || 0;
    }
    const label = { '资产类': '资产', '负债类': '负债', '收入类': '收入', '权益类': '权益', '费用类': '费用' }[cat] || cat.slice(0, 2);
    sumRows.push({ h: 24, kind: 'group', cells: [
      { v: label, k: 'str' }, { v: '', k: 'str' }, { v: '', k: 'str' }, { v: cat, k: 'str' },
      { v: Number(st.bal).toFixed(2), k: 'num' }, { v: Number(st.out).toFixed(2), k: 'num' },
      { v: Number(st.inn).toFixed(2), k: 'num' }, { v: Number(st.hout).toFixed(2), k: 'num' },
      { v: Number(st.hin).toFixed(2), k: 'num' }, { v: Number(st.open).toFixed(2), k: 'num' },
      { v: '', k: 'str' }, { v: '', k: 'str' }
    ] });
    zebraToggle = 0;
    for (const a of list) {
      const s = computeStats(a, range);
      const isDebt = (a.cat || '') === '负债类';
      sumRows.push({
        h: 22, kind: 'data', zebra: zebraToggle % 2 === 0,
        cells: [
          { v: idx++, k: 'int' },
          { v: a.cat || '', k: 'center' },
          { v: a.code || '', k: 'center' },
          { v: a.name || '', k: 'center' },
          { v: Number(s.balance).toFixed(2), k: 'num' },
          { v: Number(s.mOut).toFixed(2), k: 'num' },
          { v: Number(s.mIn).toFixed(2), k: 'num' },
          { v: Number(s.hOut).toFixed(2), k: 'num' },
          { v: Number(s.hIn).toFixed(2), k: 'num' },
          { v: Number(a.opening || 0).toFixed(2), k: 'num' },
          { v: isDebt ? (a.billDay || '') : '', k: 'center' },
          { v: isDebt ? (a.repayDay || '') : '', k: 'center' }
        ]
      });
      zebraToggle++;
    }
  }
  sheets.push({ name: '汇总', rows: sumRows, widths: [7, 11, 9, 20, 14, 13, 13, 13, 13, 14, 9, 9], freeze: 2 });

  // ===== 3. 分期 =====
  const months = installMonths();
  const instRows = [];
  const segHead = ['账户名称/分期金额', '账单日/还款日', '每月合计/本息余计'];
  const headCells = segHead.map(h => ({ v: h, k: 'str' }));
  months.forEach(() => headCells.push({ v: '', k: 'num' }));
  instRows.push({ h: 30, kind: 'head', cells: headCells });
  const monCells = [{ v: '', k: 'str' }, { v: '', k: 'str' }, { v: '', k: 'str' }];
  months.forEach(ym => {
    const yy = Math.floor(ym / 100), mm = ym % 100;
    monCells.push({ v: yy + '-' + pad2(mm) + '-01', k: 'date' });
  });
  instRows.push({ h: 24, kind: 'head', cells: monCells });

  const instTotal = {};
  (state.installments || []).forEach((inst, ii) => {
    let sumP = 0, sumI = 0;
    months.forEach(ym => { const c = inst.cells && inst.cells[ym]; if (c) { sumP += Number(c.p) || 0; sumI += Number(c.i) || 0; } });
    const pCells = [
      { v: inst.name || '', k: 'center' },
      { v: inst.billDay || '', k: 'center' },
      { v: sumP ? sumP.toFixed(2) : '', k: 'num' }
    ];
    const iCells = [
      { v: inst.principal || '', k: 'num' },
      { v: inst.repayDay || '', k: 'center' },
      { v: sumI ? sumI.toFixed(2) : '', k: 'num' }
    ];
    months.forEach(ym => {
      const c = inst.cells && inst.cells[ym];
      pCells.push({ v: c && c.p !== '' && c.p != null ? c.p : '', k: 'num' });
      iCells.push({ v: c && c.i !== '' && c.i != null ? c.i : '', k: 'num' });
    });
    instRows.push({ h: 22, kind: 'group', cells: pCells });
    instRows.push({ h: 22, kind: 'data', zebra: ii % 2 === 0, cells: iCells });
  });
  const instWidths = [18, 22, 18];
  months.forEach(() => instWidths.push(12));
  sheets.push({ name: '分期', rows: instRows, widths: instWidths, freeze: 2 });

  // ===== 打包 =====
  const files = [];
  const ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    + sheets.map((s, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')
    + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
    + '</Types>';
  files.push({ name: '[Content_Types].xml', data: _xenc.encode(ct) });
  files.push({ name: '_rels/.rels', data: _xenc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
    + '</Relationships>') });
  const wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"'
    + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
    + sheets.map((s, i) => '<sheet name="' + _xEsc(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('')
    + '</sheets></workbook>';
  files.push({ name: 'xl/workbook.xml', data: _xenc.encode(wb) });
  const wbRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + sheets.map((s, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('')
    + '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
    + '</Relationships>';
  files.push({ name: 'xl/_rels/workbook.xml.rels', data: _xenc.encode(wbRels) });
  files.push({ name: 'xl/styles.xml', data: _xenc.encode(_xlsxStyles()) });
  sheets.forEach((s, i) => {
    files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: _xenc.encode(_xlsxSheetXml(s)) });
  });
  return await xlsmZip(files);
}


/* ============================================================
   Excel 模板法导出：用你提供的 流水账V3.0.xlsx 当底版，只换内容
   ------------------------------------------------------------
   · 模板存 IndexedDB（localStorage 装不下 2MB+）
   · 保留：样式、列宽、合并单元格、冻结窗格、查询表公式、分期表布局
   · 只重写三张表的数据区：流水 r3+ / 汇总 r3+ / 分期 r3+
   ============================================================ */
const XLSX_TPL_IDB = 'flow_xlsx_template_v2';

function _idbOpen() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open('ledger_files', 1);
    rq.onupgradeneeded = () => { const db = rq.result; if (!db.objectStoreNames.contains('files')) db.createObjectStore('files'); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbPut(key, value) {
  const db = await _idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').put(value, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(key) {
  const db = await _idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('files', 'readonly');
    const rq = tx.objectStore('files').get(key);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => rej(rq.error);
  });
}

// 用模板 + 当前数据生成 .xlsx
async function buildXlsxFromTemplate(tplBytes) {
  const { map, order } = await xlsmUnzip(tplBytes.buffer.slice(tplBytes.byteOffset, tplBytes.byteOffset + tplBytes.byteLength));
  const shared = _xShared(map);
  const paths = _xFindSheets(map);
  const today = todayISO();
  const endD = new Date(today + 'T00:00:00');
  const startD = new Date(endD.getFullYear() - 1, endD.getMonth(), endD.getDate());
  const startIso = startD.getFullYear() + '-' + pad2(startD.getMonth() + 1) + '-' + pad2(startD.getDate());
  const range = { start: startIso, end: today };

  // ---------- 流水 ----------
  const flowXml = _xdec.decode(map.get(paths.flow));
  const flowRows = _xParseSheet(flowXml, shared);
  const styleAt = (rows, rowNum) => (col) => {
    const base = rows.get(rowNum) || [];
    const cn = _xColName(col);
    const hit = base.find(c => c.col === cn);
    return hit ? hit.s : null;
  };
  const flowStyle = styleAt(flowRows, 3);
  const flowData = state.transactions.slice().sort((a, b) => (a.seq || 0) - (b.seq || 0)).map((t, i) => {
    const ser = t.date ? _xSerial(t.date) : null;
    return [
      [1, String(i + 1), true],
      [2, ser == null ? '' : String(ser), true],
      [3, t.from || '', false],
      [4, t.to || '', false],
      [5, t.amount === '' || t.amount == null ? '' : Number(t.amount).toFixed(2), true],
      [6, t.note || '', false]
    ];
  });
  let newFlow = _xRebuild(flowXml, 2, flowData, flowStyle);
  // 模板里流水表冻结了很多行，重置成「前两行」（标题 + 表头）
  newFlow = newFlow.replace(/<pane[^>]*\/>/, '<pane ySplit="2" topLeftCell="A3" activePane="bottomLeft" state="frozen"/>');

  // ---------- 汇总：保留 r1（起止日期/标题）r2（表头），只改 B1/D1 的日期 + r3 起数据 ----------
  let sumXml = _xdec.decode(map.get(paths.sum));
  const sumRows = _xParseSheet(sumXml, shared);
  const sumStyle = styleAt(sumRows, 3);
  // 更新 r1 的起始/结束日期（B1 / D1）
  const s1 = _xSerial(startIso), s2 = _xSerial(today);
  if (s1 != null && s2 != null) {
    sumXml = sumXml
      .replace(/(<c r="B1"[^>]*>)<v>[^<]*<\/v>/,
        '$1<v>' + s1 + '</v>')
      .replace(/(<c r="D1"[^>]*>)<v>[^<]*<\/v>/,
        '$1<v>' + s2 + '</v>');
  }
  const accData = state.accounts.map((a, i) => {
    const st = computeStats(a, range);
    const isDebt = (a.cat || '') === '负债类';
    const row = [
      [1, String(i + 1), true],
      [2, a.cat || '', false],
      [3, a.code || '', false],
      [4, a.name || '', false],
      [5, Number(st.balance).toFixed(2), true],
      [6, Number(st.mOut).toFixed(2), true],
      [7, Number(st.mIn).toFixed(2), true],
      [8, Number(st.hOut).toFixed(2), true],
      [9, Number(st.hIn).toFixed(2), true],
      [10, Number(a.opening || 0).toFixed(2), true]
    ];
    if (isDebt) { row.push([12, a.billDay || '', false]); row.push([13, a.repayDay || '', false]); }
    return row;
  });
  const newSum = _xRebuild(sumXml, 2, accData, sumStyle);

  // ---------- 分期：保留 r1（表头）r2（月份），r3 起每分期两行 ----------
  const instXml = _xdec.decode(map.get(paths.inst));
  const instRows = _xParseSheet(instXml, shared);
  // 动态找表头行：A 列写着「账户名称」的那行；下一行是月份，再下一行开始才是数据。
  // 模板以后再加/减标题行时不用改代码。
  let headRow = 2;
  for (const [rn, cells] of [...instRows.entries()].sort((a, b) => a[0] - b[0])) {
    const ac = cells.find((c) => c.col === 'A');
    if (ac && /账户名称/.test(String(ac.v))) { headRow = rn; break; }
  }
  const monthRow = headRow + 1;
  const dataStart = headRow + 2;
  const instStyleP = styleAt(instRows, dataStart);
  const instStyleI = styleAt(instRows, dataStart + 1);
  const months = installMonths();
  // 2 行表头之后：本金行 + 利息行交替
  const instData = [];
  (state.installments || []).forEach(inst => {
    let sumP = 0, sumI = 0;
    months.forEach(ym => { const cc = inst.cells && inst.cells[ym]; if (cc) { sumP += Number(cc.p) || 0; sumI += Number(cc.i) || 0; } });
    const pRow = [
      [1, inst.name || '', false],
      [2, inst.billDay || '', false],
      [3, sumP ? sumP.toFixed(2) : '', true]
    ];
    const iRow = [
      [1, inst.principal || '', true],
      [2, inst.repayDay || '', false],
      [3, sumI ? sumI.toFixed(2) : '', true]
    ];
    months.forEach((ym, k) => {
      const cc = inst.cells && inst.cells[ym];
      const colP = 4 + k;
      pRow.push([colP, cc && cc.p !== '' && cc.p != null ? cc.p : '', true]);
      iRow.push([colP, cc && cc.i !== '' && cc.i != null ? cc.i : '', true]);
    });
    instData.push(pRow);
    instData.push(iRow);
  });
  // 分期两张行样式不同：奇数行用 r3 的样式，偶数行用 r4 的
  // 表头两行也要重写：r1 的旧合计值清空、r2 的月份换成当前区间的月份
  let instHead = instXml;
  const h1 = instRows.get(headRow) || [];
  const h2 = instRows.get(monthRow) || [];
  const headCells = [];
  const pushCell = (cells, col, val, isNum) => {
    const cn = _xColName(col);
    const hit = cells.find(c => c.col === cn);
    const s = hit ? hit.s : null;
    const sAttr = s == null ? '' : ' s="' + s + '"';
    const ref = cn + dataStart;
    if (val === '' || val == null) return;
    headCells.push('<c r="' + ref + '"' + sAttr + (isNum ? '><v>' + val + '</v></c>' : ' t="inlineStr"><is><t xml:space="preserve">' + _xEsc(String(val)) + '</t></is></c>'));
  };
  // r1：A/B/C 是合并表头，D 列起是「该月所有分期的本金合计」，按当前数据重算
  const h1Parts = [];
  ['A', 'B', 'C'].forEach(cn => {
    const hit = h1.find(c => c.col === cn);
    if (!hit) return;
    const sAttr = hit.s == null ? '' : ' s="' + hit.s + '"';
    if (hit.v && hit.v.trim()) {
      h1Parts.push('<c r="' + cn + headRow + '"' + sAttr + ' t="inlineStr"><is><t xml:space="preserve">' + _xEsc(hit.v) + '</t></is></c>');
    } else if (hit.s != null) {
      h1Parts.push('<c r="' + cn + headRow + '" s="' + hit.s + '"/>');
    }
  });
  months.forEach((ym, k) => {
    const cn = _xColName(4 + k);
    const hit = h1.find(c => c.col === cn);
    const sAttr = hit && hit.s != null ? ' s="' + hit.s + '"' : '';
    let total = 0;
    (state.installments || []).forEach(inst => {
      const cc = inst.cells && inst.cells[ym];
      if (cc) total += Number(cc.p) || 0;
    });
    h1Parts.push(total ? '<c r="' + cn + headRow + '"' + sAttr + '><v>' + total.toFixed(2) + '</v></c>'
      : '<c r="' + cn + headRow + '"' + sAttr + '/>');
  });
  const h1Row = h1Parts.join('');
  // r2 的月份：前 3 格留空，第 4 格起写月份日期
  const h2Parts = [];
  [1, 2, 3].forEach(col => {
    const hit = h2.find(c => c.col === _xColName(col));
    if (hit && hit.s != null) h2Parts.push('<c r="' + _xColName(col) + monthRow + '" s="' + hit.s + '"/>');
  });
  months.forEach((ym, k) => {
    const col = 4 + k, cn = _xColName(col);
    const hit = h2.find(c => c.col === cn);
    const s = hit ? hit.s : null;
    const sAttr = s == null ? '' : ' s="' + s + '"';
    const yy = Math.floor(ym / 100), mm = ym % 100;
    const ser = _xSerial(yy + '-' + pad2(mm) + '-01');
    h2Parts.push('<c r="' + cn + monthRow + '"' + sAttr + '><v>' + ser + '</v></c>');
  });
  instHead = instHead
    .replace(new RegExp('<row r="' + headRow + '"[^>]*>[\\s\\S]*?</row>'), (mm2) => mm2.replace(/>[\s\S]*<\/row>$/, '>' + h1Row + '</row>'))
    .replace(new RegExp('<row r="' + monthRow + '"[^>]*>[\\s\\S]*?</row>'), (mm2) => mm2.replace(/>[\s\S]*<\/row>$/, '>' + h2Parts.join('') + '</row>'));
  const newInst = _xRebuild(instHead, dataStart - 1, instData, (col) => instStyleP(col));

  // ---------- 打包 ----------
  const outEntries = order.map(e => {
    if (e.name === paths.flow) return { name: e.name, data: _xenc.encode(newFlow) };
    if (e.name === paths.sum) return { name: e.name, data: _xenc.encode(newSum) };
    if (e.name === paths.inst) return { name: e.name, data: _xenc.encode(newInst) };
    if (e.name === 'xl/workbook.xml') {
      let wb = _xdec.decode(e.data);
      if (!/fullCalcOnLoad/.test(wb)) wb = wb.replace(/<calcPr([^>]*?)\/>/, '<calcPr$1 fullCalcOnLoad="1"/>');
      return { name: e.name, data: _xenc.encode(wb) };
    }
    return e;
  });
  return await xlsmZip(outEntries);
}

// 「Excel」按钮：有模板就走模板，没有就提示选文件
async function exportXLSX() {
  let tpl = null;
  try { tpl = await idbGet(XLSX_TPL_IDB); } catch (e) { /* 忽略 */ }
  if (!tpl) { openXlsmDialog(); return; }
  const bytes = await buildXlsxFromTemplate(tpl);
  const name = '流水账_' + todayISO() + '.xlsx';
  const type = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const blob = new Blob([bytes], { type });
  toast('已生成 Excel（' + Math.round(bytes.length / 1024) + ' KB）：流水 ' + state.transactions.length + ' 笔、账户 ' + state.accounts.length + ' 个、分期 ' + (state.installments || []).length + ' 个', { duration: 5000 });
  // 1) 桌面 Chrome / Edge：弹系统「另存为」，自己选目录和文件名
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: name,
        types: [{ description: 'Excel 工作簿', accept: { [type]: ['.xlsx'] } }]
      });
      const w = await handle.createWritable();
      await w.write(bytes);
      await w.close();
      toast('已保存：' + handle.name);
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // 用户取消
      // 其他错误就继续往下走
    }
  }
  // 2) 兜底：浏览器默认下载目录（分享 API 在手机上常被拦截，已去掉）
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function openXlsmDialog() {
  const has = !!(await idbGet(XLSX_TPL_IDB));
  const mask = document.createElement('div');
  mask.className = 'confirm-mask';
  mask.innerHTML = `
    <div class="sync-box">
      <div class="sync-title">导出 Excel</div>
      <div class="sync-hint">${has ? '已保存模板。点下方按钮导出，会先让你选保存位置。' : '第一次使用请先选一次 <b>.xlsx 模板</b>（流水账V3.0.xlsx 这类，含「流水」「汇总」「分期」三张表）。以后每次导出都会套用它。'}</div>
      <div class="sync-block">
        <button type="button" class="ghost" id="x-pick">${has ? '更换模板…' : '选择模板 .xlsx…'}</button>
        <input type="file" id="x-file" accept=".xlsx,.xlsm" style="display:none">
        <div class="sync-or">— 模板 / 导出 —</div>
        <button type="button" id="x-export" ${has ? '' : 'disabled'}>导出 .xlsx（选保存位置）</button>
        <button type="button" class="ghost" id="x-import">从 Excel 添加流水</button>
        <input type="file" id="x-ifile" accept=".xlsx,.xlsm" style="display:none">
      </div>
      <div class="sync-actions"><button type="button" data-act="close">关闭</button></div>
    </div>`;
  document.body.appendChild(mask);
  const close = () => mask.remove();
  mask.addEventListener('click', e => {
    if (e.target === mask || (e.target.dataset && e.target.dataset.act === 'close')) close();
  });
  mask.querySelector('#x-pick').onclick = () => mask.querySelector('#x-file').click();
  mask.querySelector('#x-file').onchange = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const bin = new Uint8Array(await f.arrayBuffer());
      const { map } = await xlsmUnzip(bin.buffer.slice(bin.byteOffset, bin.byteOffset + bin.byteLength));
      const paths = _xFindSheets(map);
      if (!paths.inst) throw new Error('模板里还需要一张名为「分期」的工作表');
      await idbPut(XLSX_TPL_IDB, bin);
      toast('模板已保存（' + Math.round(bin.length / 1024) + ' KB）');
      close(); await openXlsmDialog();
    } catch (err) { toast('模板读取失败：' + err.message, { type: 'error', duration: 6000 }); }
  };
  mask.querySelector('#x-export').onclick = async () => {
    try { close(); await exportXLSX(); }
    catch (err) { toast('导出失败：' + err.message, { type: 'error', duration: 6000 }); }
  };
  mask.querySelector('#x-import').onclick = () => mask.querySelector('#x-ifile').click();
  mask.querySelector('#x-ifile').onchange = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    askConfirm('把文件里的流水<b>追加</b>到当前账本？<br>账户按文件内容替换，流水全部追加不做去重。', async () => {
      try {
        const data = await readXLSMFile(f);
        if (!data.accounts.length && !data.transactions.length) { toast('这个文件里没读到数据', { type: 'error' }); return; }
        // 账户：按文件替换（和最初的 TXT 导入规则一致）
        if (data.accounts.length) state.accounts = data.accounts;
        // 流水：追加 + 去重（日期/转出/转入/金额/备注 全相同视为同一笔）
        // 全部追加，不做重复判断
        let added = 0;
        for (const t of data.transactions) {
          state.transactions.push(t);
          added++;
        }
        reseq(); save(); render(); close();
        toast('已追加 ' + added + ' 笔流水；账户 ' + state.accounts.length + ' 个', { duration: 5000 });
      } catch (err) { toast('导入失败：' + err.message, { type: 'error', duration: 6000 }); }
    });
  };
}

/* ============================================================
   VIII. 列宽拖拽（Excel 式）
   ------------------------------------------------------------
   两种模式，按表区分：
   · 查询表 —— 拖列线时相邻两列此消彼长，表格宽度恒为 100%。三栏因此
     始终保持窗口 1/3，表格右边缘也永远贴住栏的分割线。
   · 流水 / 汇总 —— 列宽是绝对像素，只动被拖的那一列，表格总宽 = 各列
     之和，因此可以和窗口宽度不一致（窄了右边留白、宽了横向滚动）。
   双击边界都按内容自适应。
   ============================================================ */
const COLW_KEY = 'flow_col_widths_v3';        // v3：统一存像素
const COLW_KEY_V1 = 'flow_col_widths_v1';     // v1：存像素，格式相同可直接用
const COLW_KEY_V2 = 'flow_col_widths_v2';     // v2：曾经存过比例，×1000 折算成像素
const COL_MIN = 36;

function normShares(arr) {
  const sum = arr.reduce((a, b) => a + (Number(b) > 0 ? Number(b) : 0), 0) || 1;
  return arr.map(v => Math.max(0, Number(v) || 0) / sum);
}

let colWidths = (() => {
  const parse = (raw, scale) => {
    const out = {};
    try {
      const o = JSON.parse(raw || '{}');
      if (!o || typeof o !== 'object' || Array.isArray(o)) return out;
      Object.keys(o).forEach(k => {
        const a = o[k];
        if (Array.isArray(a) && a.length && a.every(n => typeof n === 'number' && n > 0)) {
          out[k] = a.map(v => v * (scale || 1));
        }
      });
    } catch (e) {}
    return out;
  };
  try {
    const v3 = localStorage.getItem(COLW_KEY);
    if (v3) return parse(v3, 1);
    const v1 = localStorage.getItem(COLW_KEY_V1);
    if (v1) return parse(v1, 1);
    const v2 = localStorage.getItem(COLW_KEY_V2);
    if (v2) return parse(v2, 1000);   // 比例 ×1000 折算成像素
  } catch (e) {}
  return {};
})();

function saveColWidths() {
  try { localStorage.setItem(COLW_KEY, JSON.stringify(colWidths)); } catch (e) {}
}

// 列头行：流水/汇总就是 thead 唯一一行；查询页是蓝色那行（thead 最后一行）
function colHeadRow(table) {
  const rows = table.querySelectorAll('thead tr');
  return rows.length ? rows[rows.length - 1] : null;
}

function ensureColgroup(table) {
  const headRow = colHeadRow(table);
  if (!headRow) return null;
  const n = headRow.querySelectorAll('th').length;
  let cg = table.querySelector('colgroup');
  if (cg && cg.children.length === n) return cg;
  if (cg) cg.remove();
  cg = document.createElement('colgroup');
  for (let i = 0; i < n; i++) cg.appendChild(document.createElement('col'));
  table.insertBefore(cg, table.firstChild);
  return cg;
}

// 当前各列的实际像素宽度（拖动过程中始终以屏幕上真实渲染的宽度为基准）
function widthsOf(table) {
  const headRow = colHeadRow(table);
  return Array.from(headRow.querySelectorAll('th')).map(th => th.getBoundingClientRect().width);
}

// 写入列宽。查询表把像素归一化成比例并让表格恒占 100%；
// 流水/汇总直接用绝对像素，表格总宽 = 各列之和（可与窗口宽度不一致）。
function applyWidths(table, key, px) {
  const cg = ensureColgroup(table);
  if (!cg) return;
  const cols = cg.querySelectorAll('col');
  const w = px.map(v => Math.max(COL_MIN, Math.round(v)));
  if (key === 'query') {
    const sum = w.reduce((a, b) => a + b, 0) || 1;
    w.forEach((v, i) => { if (cols[i]) cols[i].style.width = (v / sum * 100).toFixed(4) + '%'; });
    table.style.width = '100%';
  } else {
    w.forEach((v, i) => { if (cols[i]) cols[i].style.width = v + 'px'; });
    table.style.width = w.reduce((a, b) => a + b, 0) + 'px';
  }
  table.classList.add('cols-custom');
  colWidths[key] = w;
}

// 查询页两张表共用一套列宽，改一张要同步另一张
function paintWidths(key, widths) {
  document.querySelectorAll('table[data-colkey="' + key + '"]').forEach(t => applyWidths(t, key, widths));
}

let _measureCtx = null;
function measureCtx() {
  if (!_measureCtx) _measureCtx = document.createElement('canvas').getContext('2d');
  return _measureCtx;
}
function textBoxWidth(el) {
  try {
    const r = document.createRange();
    r.selectNodeContents(el);
    return r.getBoundingClientRect().width;
  } catch (e) { return 0; }
}

// 双击列边界：按该列最宽的内容算
function fitWidth(table, idx) {
  const headRow = colHeadRow(table);
  const th = headRow && headRow.querySelectorAll('th')[idx];
  if (!th) return COL_MIN;
  const thCs = getComputedStyle(th);
  // 表头里有个绝对定位的拖拽把手，用 Range 量 textContent 会把把手算进去，
  // 结果永远约等于当前宽度 —— 所以表头改用 canvas 按纯文字量。
  const c = measureCtx();
  try { c.font = thCs.font; } catch (e) { c.font = thCs.fontSize + ' ' + thCs.fontFamily; }
  let w = c.measureText(th.textContent.trim()).width
        + parseFloat(thCs.paddingLeft) + parseFloat(thCs.paddingRight);

  table.querySelectorAll('tbody tr').forEach(tr => {
    const cell = tr.children[idx];
    if (!cell || cell.tagName !== 'TD' || cell.colSpan > 1) return;
    const cs = getComputedStyle(cell);
    const pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const inp = cell.querySelector('input');
    if (inp) {
      const ics = getComputedStyle(inp);
      try { c.font = ics.font; } catch (e) { c.font = ics.fontSize + ' ' + ics.fontFamily; }
      const t = c.measureText(inp.value || '').width;
      w = Math.max(w, t + parseFloat(ics.paddingLeft) + parseFloat(ics.paddingRight) + pad + 4);
    } else {
      w = Math.max(w, textBoxWidth(cell) + pad);
    }
  });
  return Math.max(COL_MIN, Math.ceil(w) + 8);
}

function initColResize(table, key) {
  if (!table) return;
  table.dataset.colkey = key;
  const headRow = colHeadRow(table);
  if (!headRow) return;
  ensureColgroup(table);
  const ths = Array.from(headRow.querySelectorAll('th'));
  if (Array.isArray(colWidths[key]) && colWidths[key].length === ths.length) {
    applyWidths(table, key, colWidths[key]);
  }

  ths.forEach((th, idx) => {
    if (th.querySelector('.col-resizer')) return;
    const grip = document.createElement('div');
    grip.className = 'col-resizer';
    grip.title = '拖拽调整列宽 · 双击自动适应';
    th.appendChild(grip);

    grip.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      const startX = e.clientX;
      const base = widthsOf(table);
      const n = base.length;
      const isQuery = key === 'query';
      // 查询表：相邻列承担反方向的等量变化，两列之和不变 → 整栏宽度不变。
      // 流水/汇总：只动被拖的那一列，表格总宽跟着变（可与窗口宽度不一致）。
      const partner = idx < n - 1 ? idx + 1 : idx - 1;
      const pairSum = base[idx] + base[partner];
      let moved = false;
      grip.classList.add('dragging');
      try { grip.setPointerCapture(e.pointerId); } catch (err) {}

      const onMove = me => {
        const delta = me.clientX - startX;
        const next = base.slice();
        if (isQuery) {
          let a = base[idx] + delta;
          let b = pairSum - a;
          if (a < COL_MIN) { a = COL_MIN; b = pairSum - COL_MIN; }
          if (b < COL_MIN) { b = COL_MIN; a = pairSum - COL_MIN; }
          next[idx] = a; next[partner] = b;
        } else {
          next[idx] = Math.max(COL_MIN, base[idx] + delta);
        }
        moved = true;
        paintWidths(key, next);
      };
      const onUp = () => {
        grip.removeEventListener('pointermove', onMove);
        grip.removeEventListener('pointerup', onUp);
        grip.removeEventListener('pointercancel', onUp);
        grip.classList.remove('dragging');
        if (moved) {
          saveColWidths(); syncFlowTitleWidth(); syncGridRight();
          // applySummarySticky 是 renderSummary 内部的局部函数，非汇总页时不存在
          if (typeof applySummarySticky === 'function') { try { applySummarySticky(); } catch (e) {} }
        }
      };
      grip.addEventListener('pointermove', onMove);
      grip.addEventListener('pointerup', onUp);
      grip.addEventListener('pointercancel', onUp);
    });

    grip.addEventListener('dblclick', e => {
      e.preventDefault();
      e.stopPropagation();
      const base = widthsOf(table);
      const n = base.length;
      const next = base.slice();
      const want = Math.max(COL_MIN, fitWidth(table, idx));
      if (key === 'query') {
        const partner = idx < n - 1 ? idx + 1 : idx - 1;
        const pairSum = base[idx] + base[partner];
        const target = Math.min(pairSum - COL_MIN, want);
        next[idx] = target;
        next[partner] = Math.max(COL_MIN, pairSum - target);
      } else {
        next[idx] = want;
      }
      paintWidths(key, next);
      saveColWidths();
      syncFlowTitleWidth();
    });
  });
}

/* ============================================================
   IX. 启动应用
   ============================================================ */
// 金额 / 期初格聚焦时剥掉 ¥ 和千分位，变成纯数字方便直接编辑；
// 各表自己的 blur 处理器会在失焦时再格式化回财务格式。
document.addEventListener('focus', e => {
  const input = e.target;
  if (!input || input.tagName !== 'INPUT') return;
  const f = input.dataset.field;
  if (f !== 'amount' && f !== 'opening') return;
  const raw = normalizeAmount(input.value);
  input.value = raw === '' ? '' : String(raw);
}, true);

document.querySelectorAll('.tabbar button').forEach(b => {
  b.onclick = () => { currentTab = b.dataset.tab; render(); };
});
// 固定支出：当天 5:00 之后第一次打开时，把到期的自动写进流水
try {
  const nFixed = runFixedExpenses();
  if (nFixed > 0) setTimeout(() => toast("已自动记入 " + nFixed + " 笔固定支出", { duration: 5000 }), 600);
} catch (e) {}

applyTheme();
render();
</script>
<div id="print-area"></div>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
