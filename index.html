<style>
/* ==========================================
   1. 全局变量与基础设置
   ========================================== */
:root {
  --primary: #6b5bc4;
  --primary-dark: #574aa6;
  --bg-main: #ffffff;
  --bg-gray: #f1f5f9;
  --bg-gray-light: #f8fafc;
  --bg-dark: #1e293b;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-light: #94a3b8;
  --border: #cbd5e1;
  --border-light: #e2e8f0;
  --danger: #ef4444;
  --success: #10b981;
  --radius: 6px;
  --font-sys: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --bar-bg: #1e293b;
  --bar-text: #ffffff;
  --bar-text-dim: #cbd5e1;
  --deep-blue: #2a2a4a;
}

/* 反色（暗色）主题：只换变量，其余样式自动跟随 */
[data-theme="dark"] {
  /* 底色全部用中性黑灰，不带蓝；只有选中态保留一点蓝做强调 */
  --primary: #5b4ea8;
  --primary-dark: #6b5bc4;
  --bg-main: #000000;
  --bg-gray: #0d0d0d;
  /* 斑马纹：原来 #131313 压在纯黑上几乎看不出，提到 #1c1c1c 才有条纹感 */
  --bg-gray-light: #1c1c1c;
  --bg-dark: #ffffff;
  /* 正文以纯白为主，次要信息才降一档 */
  --text-main: #ffffff;
  --text-muted: #e0e0e0;
  --text-light: #b4b4b4;
  --border: #3a3a3a;
  /* 单元格竖边框：原来 #1c1c1c 与黑底几乎同色，拉到 #343434 才看得见分格 */
  --border-light: #343434;
  /* 红绿提亮到暗底上也足够醒目 */
  --danger: #ff9d9d;
  --success: #5ee9a4;
  --money-in: #5ee9a4;
  --money-out: #ff9d9d;
  /* 分类分组行 / 页脚这类「深底条」在暗色下用深灰而不是纯白 */
  --bar-bg: #232323;
  --bar-text: #ffffff;
  --bar-text-dim: #c8c8c8;
  /* 分期账户名的深暗蓝 */
  --deep-blue: #2a2140;  /* 和按钮背景统一 */
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: var(--font-sys); }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg-gray); color: var(--text-main); font-size: 14px; }
body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* ==========================================
   2. 布局与导航
   ========================================== */
/* 标签栏高度同其它行统一为 32px（含 3px 的选中下划线） */
.tabbar { flex-shrink: 0; display: flex; height: 40px; background: var(--bg-gray); overflow-x: auto; border-bottom: 2px solid var(--primary); }
.tabbar button { flex: 1 1 0; min-width: 0; height: 100%; box-sizing: border-box; background: none; border: none; border-left: 1px solid var(--border-light); color: var(--text-muted); padding: 0 2px; font-size: 15px; font-weight: 700; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabbar button:first-child { border-left: none; }
.tabbar button.active { color: #ffffff; background: var(--primary); border-bottom-color: #1e40af; }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg-main); overflow: hidden; }
#footer::after {
  content: attr(data-ver);
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  opacity: 0.55;
  font-weight: 400;
}
footer { flex-shrink: 0; background: var(--bar-bg); color: var(--bar-text-dim); padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom)); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.grid-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg-main); }

/* ==========================================
   3. 通用表格与表单样式 (增强可读性)
   ========================================== */
table.grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 14px; width: 100%; }
table.grid thead th { position: sticky; top: 0; z-index: 3; background: var(--bg-gray); color: var(--text-muted); font-weight: 700; font-size: 13px; padding: 7px 2px; text-align: center; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.grid tbody td { padding: 0; border-bottom: 1px solid var(--border-light); border-right: 1px solid var(--border-light); vertical-align: middle; background: var(--bg-main); }
table.grid tbody tr:nth-child(even) td { background: var(--bg-gray-light); }
table.grid tbody tr:hover td { background: #f3f1fb; } /* 悬停高亮，增加可读性 */

/* 序号列固定 */
table.grid thead th.col-seq { left: 0; z-index: 4; text-align: center; }
table.grid tbody td.col-seq { position: sticky; left: 0; z-index: 2; background: var(--bg-gray); text-align: center; color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
table.grid tbody tr:nth-child(even) td.col-seq { background: var(--bg-gray-light); }

/* 输入框样式（行高统一为 32px：内容 19 + 上下 6 + 边框 1） */
table.grid input { width: 100%; border: none; background: transparent; padding: 6px; font-size: 14px; color: var(--text-main); outline: none; border-radius: 0; transition: background 0.2s; }
/* 流水表列宽可以压得很窄：内边距收小一点，文字才能贴着列边，不然 44px 的列里有 12px 是空白 */
table#flow-table tbody td input { padding: 3px 0; }   /* 左右 0：文字直接贴边框（对齐分期表账单日/还款日那种）
table#flow-table thead th { padding: 7px 0; }
table#flow-table td.col-amount input { padding-right: 0; }
/* number 的上下箭头会吃掉十几像素，列一窄金额就被截掉尾数（"1234.56" → "1234.5"）。
   记账用不到 spinner，直接去掉。 */
table.grid input[type="number"]::-webkit-outer-spin-button,
table.grid input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
table.grid input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
table.grid input:focus { background: #dbeafe; box-shadow: inset 0 0 0 2px var(--primary); position: relative; z-index: 1; }
table.grid input::placeholder { color: var(--text-light); }

/* 只读单元格 */
/* 只读单元格不设自己的背景 —— 交给 tbody 的奇偶行规则统一处理。
   之前这里是 rgba(248,250,252,.6) + !important，半透明盖在白色行上会比左边淡一截，
   导致「账户」是白的、「金额」是浅灰的，一行里两种底色对不齐。 */
table.grid tbody td.readonly { color: var(--text-main); padding: 7px 6px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
table.grid tbody td.readonly.strong { font-weight: 700; color: #1e293b; }
table.grid td.col-amount input, table.grid td.col-amount.readonly { text-align: right; padding-right: 2px; font-weight: 600; color: var(--text-main); }

/* 列对齐：日期居中、金额靠右、备注靠左；转出/转入居中（保持原样） */
table#flow-table td.col-date input { text-align: center; }
table#flow-table td.col-from input,
table#flow-table td.col-to input { text-align: var(--cell-align, center); }
table#flow-table td.col-note input { text-align: left; }
table#summary-table td.col-cat input,
table#summary-table td.col-code input,
table#summary-table td.col-name input { text-align: center; }

/* 删除按钮不单独占一列，绝对定位在某一列的右（左）端，不参与列宽拖拽、不算表格列数。
   流水表挂在行尾「备注」格；汇总表挂在「账单日」格左端，也就是期初列后面。 */
table.grid tbody td.col-note { position: relative; padding-right: 30px; }
table.grid tbody td.col-bill { position: relative; padding-left: 30px; }
.row-del { position: absolute; right: 0; top: 0; bottom: 0; width: 30px; padding: 0; background: none; border: none; color: var(--border); font-size: 13px; line-height: 1; cursor: pointer; transition: color 0.2s; }
table.grid tbody td.col-bill > .row-del { right: auto; left: 0; }
.row-del:active { color: var(--danger); background: #fee2e2; }
/* 备注格：不换行、超出裁掉，避免列窄时文字顶到按钮上 */
table#flow-table tbody td.col-note { white-space: nowrap; overflow: hidden; }
/* 删除按钮收窄到 18px（原来 22px），勾选框 12px，合计占位从 45px 降到 33px */
table#flow-table tbody td.col-note > .row-del { right: 18px; width: 18px; font-size: 13px; }
/* 三个页面的标题统一：最左、和后面按钮留 4 个字符的间距 */
.toolbar.flow-bar .flow-title,
.toolbar.flow-bar .bar-title,
.toolbar.flow-bar .fixed-title {
  flex: 0 0 auto;
  padding-left: 0;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-main);
  white-space: nowrap;
}
/* 流水 / 分期：标题后跟按钮，留 4 个字符的间距 */
.toolbar.flow-bar .flow-title,
.toolbar.flow-bar .bar-title { margin-right: 3em; }
/* 固定页标题后面是合计项，间距小一些，避免挤到换行 */
.fixed-bar .fixed-title { margin-right: 16px; }
.fixed-bar { flex-wrap: nowrap; overflow-x: auto; }
.fixed-bar .fixed-sum { white-space: nowrap; }

/* 固定页顶部：标题 + 收入/支出合计 */
.fixed-bar { gap: 12px; }
/* 「收入合计」金额和下一个标签之间多留半个汉字 */
.fixed-bar .fixed-sum + .fixed-sum { margin-left: 7px; }
.fixed-bar .fixed-title { font-size: 14px; font-weight: 700; color: var(--text-main); flex: 0 0 auto; }
.fixed-bar .fixed-sum { display: inline-flex; align-items: baseline; gap: 4px; flex: 0 0 auto; }
.fixed-bar .fixed-sum i { font-style: normal; font-size: 12px; color: var(--text-muted); }
.fixed-bar .fixed-sum b { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: left; display: inline-block; }
.fixed-bar .fixed-sum b.in { color: var(--success); }
.fixed-bar .fixed-sum b.out { color: var(--danger); }

/* ---- 暗色补丁（第二批）：输入框、选中态、冻结列、查询标题行 ---- */
[data-theme="dark"] {
  --cell-hover: #202020;
  --cell-active: #2b2b2b;
}
/* 输入框回到「单元格本身就是线框」的模式：透明底、无边框，只调字号 */
[data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea {
  background-color: transparent !important;
  border: none !important;
  border-radius: 0 !important;
  color: #ffffff !important;
  font-size: 12px !important;
  outline: none !important;
  box-shadow: none !important;
}
/* 未选中的单元格：足够深的底；选中时只淡一点点 */
[data-theme="dark"] table.grid tbody td,
[data-theme="dark"] table.query-table tbody td,
[data-theme="dark"] table.install-table tbody td {
  background-color: #0a0a0a !important;
}
[data-theme="dark"] table.grid tbody tr:nth-child(even) td,
[data-theme="dark"] table.query-table tbody tr:nth-child(even) td {
  background-color: #121212 !important;
}
[data-theme="dark"] table.grid thead th,
[data-theme="dark"] table.query-table thead th,
[data-theme="dark"] table.install-table thead th {
  background-color: #141414 !important;
}
/* 选中 = 淡一点点（不是亮一截）；特异性要压过 tbody td 那条 */
[data-theme="dark"] table.grid tbody td:focus-within,
[data-theme="dark"] table.query-table tbody td:focus-within,
[data-theme="dark"] table.install-table tbody td:focus-within,
[data-theme="dark"] table.grid tbody tr:nth-child(even) td:focus-within,
[data-theme="dark"] table.query-table tbody tr:nth-child(even) td:focus-within,
[data-theme="dark"] td.cell-active { background-color: #262626 !important; }
[data-theme="dark"] input:focus { background-color: transparent !important; color: #ffffff !important; }
/* 选中的单元格：深灰底 + 纯白字 */
[data-theme="dark"] td:focus-within,
[data-theme="dark"] .cell-active { background-color: var(--cell-active) !important; }
[data-theme="dark"] td:focus-within input,
[data-theme="dark"] .cell-active input { color: #ffffff !important; }
/* 冻结列必须有实心深色背景，否则横向滚动时后面的文字会透出来 */
[data-theme="dark"] table.grid thead th.col-seq,
[data-theme="dark"] table.grid tbody td.col-seq,
[data-theme="dark"] table#summary-table thead th.col-name,
[data-theme="dark"] table#summary-table tbody td.col-name,
[data-theme="dark"] table.query-table thead th.col-seq,
[data-theme="dark"] table.query-table tbody td.col-seq {
  background-color: #0d0d0d !important;
  color: var(--text-main) !important;
  box-shadow: 1px 0 0 #333333 !important;
}
[data-theme="dark"] table.grid tbody tr:nth-child(even) td.col-seq,
[data-theme="dark"] table#summary-table tbody tr:nth-child(even) td.col-name {
  background-color: #171717 !important;
}
/* 查询页：三行标题（含「清空」那行）全部压深 */
[data-theme="dark"] table.query-table thead th,
[data-theme="dark"] table.query-table tr.q-title-row th,
[data-theme="dark"] table.query-table tr.q-filter-row th,
[data-theme="dark"] table.query-table tr.q-head-row th {
  background-color: #141414 !important;
  border-color: #2c2c2c !important;
}
[data-theme="dark"] .q-title-inner { background: transparent !important; }
[data-theme="dark"] .q-title { color: #ffffff !important; }
[data-theme="dark"] .q-total { color: var(--money-in) !important; }
/* 查询表空白提示 / 结果行 */
[data-theme="dark"] table.query-table tbody td { background-color: transparent !important; color: var(--text-main) !important; }
[data-theme="dark"] .query-empty { background: #141414 !important; color: var(--text-muted) !important; }
/* 分期表整块深色，去掉残留白底 */
[data-theme="dark"] table.install-table { background-color: #0a0a0a !important; }
[data-theme="dark"] table.install-table thead th.inst-total,
[data-theme="dark"] table.install-table thead th { background-color: #141414 !important; color: var(--text-muted) !important; }

/* ---- 暗色斑马纹统一：奇数行统一 #0d0d0d，偶数行统一 #1a1a1a ----
   之前汇总/分期被各种局部规则拆得七零八落（sticky 列、分组行、利息行各用一套），
   这里用一整组高特异性选择器把它们压平。 */
[data-theme="dark"] table.grid tbody tr:nth-child(odd) > td,
[data-theme="dark"] table.query-table tbody tr:nth-child(odd) > td,
[data-theme="dark"] table.install-table tbody tr:nth-child(odd) > td {
  background-color: #0d0d0d !important;
}
[data-theme="dark"] table.grid tbody tr:nth-child(even) > td,
[data-theme="dark"] table.query-table tbody tr:nth-child(even) > td,
[data-theme="dark"] table.install-table tbody tr:nth-child(even) > td {
  background-color: #1a1a1a !important;
}
/* 分期表：本金行/利息行的 td 一律跟随斑马纹（含名称列以外的所有列） */
[data-theme="dark"] table.install-table tbody tr:nth-child(odd) > td:not(.col-name) { background-color: #0d0d0d !important; }
[data-theme="dark"] table.install-table tbody tr:nth-child(even) > td:not(.col-name) { background-color: #1a1a1a !important; }
/* 分类分组行：每个 td 一律 #232323，压过上面的斑马纹（加 (1,1,3) 特异性） */
[data-theme="dark"] table.grid tbody tr.cat-row > td,
[data-theme="dark"] table.grid tbody tr.cat-row:nth-child(odd) > td,
[data-theme="dark"] table.grid tbody tr.cat-row:nth-child(even) > td {
  background-color: transparent !important;
  color: #b9a6ff !important;
}
[data-theme="dark"] table.grid tbody tr.cat-row > td.col-bill,
[data-theme="dark"] table.grid tbody tr.cat-row > td.col-repay { color: #8e7fd0 !important; }
/* 冻结列（序号 / 账户名称）在分组行里也必须跟分组行同色，不再沿用斑马纹 */
[data-theme="dark"] table.grid tbody tr.cat-row > td.col-seq,
[data-theme="dark"] table#summary-table tbody tr.cat-row > td.col-name,
[data-theme="dark"] table.grid tbody tr.cat-row:nth-child(odd) > td.col-seq,
[data-theme="dark"] table.grid tbody tr.cat-row:nth-child(even) > td.col-seq,
[data-theme="dark"] table#summary-table tbody tr.cat-row:nth-child(odd) > td.col-name,
[data-theme="dark"] table#summary-table tbody tr.cat-row:nth-child(even) > td.col-name {
  background-color: transparent !important;
  color: #b9a6ff !important;
}
/* 冻结列跟着所在行走，不再固定浅色 */
[data-theme="dark"] table.grid tbody tr:nth-child(odd) > td.col-seq,
[data-theme="dark"] table#summary-table tbody tr:nth-child(odd) > td.col-name,
[data-theme="dark"] table.query-table tbody tr:nth-child(odd) > td.col-seq {
  background-color: #0d0d0d !important;
}
[data-theme="dark"] table.grid tbody tr:nth-child(even) > td.col-seq,
[data-theme="dark"] table#summary-table tbody tr:nth-child(even) > td.col-name,
[data-theme="dark"] table.query-table tbody tr:nth-child(even) > td.col-seq {
  background-color: #1a1a1a !important;
}
/* 分期：本金行/利息行不再各用一套底色，交给上面的斑马纹 */
[data-theme="dark"] table.install-table tr.inst-p td.col-name input { color: #b9a6ff !important; font-weight: 700; }

/* 暗色下：页脚、分类分组条、分期账户名统一深底白字，不留浅色块 */
[data-theme="dark"] footer { background: var(--bar-bg) !important; color: var(--bar-text-dim) !important; }
/* 分组行必须排在「tbody td 透明」之后，否则会被抹掉 */
[data-theme="dark"] table.grid .cat-row td,
[data-theme="dark"] .cat-row td { background: transparent !important; color: #b9a6ff !important; }
[data-theme="dark"] table#summary-table .cat-row td.col-bill,
[data-theme="dark"] table#summary-table .cat-row td.col-repay { color: #8e7fd0 !important; }
[data-theme="dark"] table.install-table tr.inst-p td.col-name { background: inherit !important; }
[data-theme="dark"] table.install-table tr.inst-i td.col-name { background: inherit !important; }
[data-theme="dark"] table.install-table tbody tr.inst-i:nth-child(odd) td.col-name { background: #0d0d0d !important; }
[data-theme="dark"] table.install-table tbody tr.inst-i:nth-child(even) td.col-name { background: #1a1a1a !important; }
[data-theme="dark"] table.install-table tr.inst-p td.col-name input { color: #ffffff !important; }
/* 分期利息行别留白底 */
[data-theme="dark"] table.install-table tr.inst-i td,
[data-theme="dark"] table.install-table tr.inst-i td.col-name { background: #0a0a0a !important; color: var(--text-main) !important; }
[data-theme="dark"] table.install-table tr.inst-p td { background: #121212 !important; }
[data-theme="dark"] table.install-table tr.inst-p td.col-name { background: var(--deep-blue) !important; }

[data-theme="dark"] table.install-table thead th,
[data-theme="dark"] table.install-table th { background: var(--bg-gray-light) !important; color: var(--text-muted) !important; }
[data-theme="dark"] .grid-wrap { background: var(--bg-gray) !important; }
/* 汇总「当前结余」在暗色下用亮白加粗，确保看清 */
[data-theme="dark"] table#summary-table td.col-bal,
[data-theme="dark"] table#summary-table td.col-bal input { color: #ffffff !important; font-weight: 700; }
[data-theme="dark"] table#summary-table td.col-bal input { color: #ffffff !important; }
/* 查询表金额列同样处理 */
[data-theme="dark"] table.query-table td.col-amount { color: #ffffff !important; }
/* 拖拽手柄、空提示等细节也别是浅色 */
[data-theme="dark"] .grid-wrap, [data-theme="dark"] .query-section { background: var(--bg-gray) !important; }
[data-theme="dark"] .sync-box { background: var(--bg-gray-light) !important; color: var(--text-main) !important; }
[data-theme="dark"] .toast { background: #2a2a2a !important; color: #ffffff !important; }

/* 可编辑的输入框用纯黑字，只读内容用灰字 —— 一眼能看出哪里能改 */
input, select, textarea { color: #000000 !important; }
table.query-table thead th input { color: #000000 !important; }
input::placeholder, textarea::placeholder { color: #9aa7b8 !important; }
table.grid tbody td, table.query-table tbody td, table.install-table tbody td { color: var(--text-muted); }
/* 反色主题下可编辑内容用亮白，和暗底形成对比 */
[data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea { color: #ffffff !important; }
/* 暗色下按钮 / 卡片底色 */
[data-theme="dark"] .toolbar, [data-theme="dark"] .tabbar,
[data-theme="dark"] .grid-wrap, [data-theme="dark"] table.grid,
[data-theme="dark"] table.query-table, [data-theme="dark"] table.install-table {
  background-color: var(--bg-gray-light);
  color: var(--text-main);
}
/* 暗色下按钮：深底 + 亮边 + 亮字，别再是白块 */
[data-theme="dark"] button, [data-theme="dark"] button.ghost {
  background-color: #1a1a1a !important;
  color: var(--text-main) !important;
  border: 1px solid var(--border) !important;
}
[data-theme="dark"] button.active, [data-theme="dark"] button[data-active="true"] {
  background-color: var(--primary) !important;
  /* 选中不反色成黑，用「白再压一点灰」，蓝底上依然清楚又不刺眼 */
  color: #ececec !important;
  border-color: var(--primary) !important;
}
/* 标签栏按钮不要额外边框 */
[data-theme="dark"] .tabbar button {
  background-color: transparent !important;
  border: none !important;
  border-left: 1px solid var(--border-light) !important;
  color: var(--text-muted) !important;
}
[data-theme="dark"] .tabbar button.active {
  background-color: var(--primary) !important;
  color: #ececec !important;
}
[data-theme="dark"] .tabbar button:first-child { border-left: none !important; }
[data-theme="dark"] .toolbar { background-color: var(--bg-main); }
[data-theme="dark"] .fixed-bar { background-color: var(--bg-main); }
[data-theme="dark"] td, [data-theme="dark"] th { border-color: var(--border-light) !important; }
[data-theme="dark"] table.grid tbody td { background: transparent; }
[data-theme="dark"] table.grid tbody td.col-seq { background: var(--bg-gray); }
[data-theme="dark"] table.grid tbody tr:nth-child(even) td.col-seq { background: var(--bg-gray-light); }
[data-theme="dark"] input::placeholder { color: #64748b !important; }

/* 表头统一：字号加大到 14px（颜色沿用各表原有的灰色，不改） */
table.grid thead th, table.query-table thead th, table.install-table thead th {
  font-size: 15px !important;
  white-space: nowrap;
}
/* 查询表的筛选输入行也统一成小一号灰字 */
table.query-table thead th input {
  font-size: 12px !important;
  color: #64748b !important;
}
table.query-table thead th input:focus { color: #0f172a !important; }

/* 统一按钮：字号一致、黑字（放最后 + !important，压过前面各页的局部规则） */
button { font-size: 14px !important; color: #0f172a !important; }
button.ghost { color: #0f172a !important; }
/* 深色底上的标签栏按钮保持白字 */
.tabbar button { font-size: 15px !important; color: var(--text-muted) !important; }
.tabbar button.active { color: #ffffff !important; }
/* 危险操作（删除）保持原有浅色，hover/active 由 .row-del 自己控制 */
button.row-del { color: var(--border) !important; }
button.row-del:active { color: var(--danger) !important; }
/* 月份小按钮字号跟着统一，仍然 44px 宽放得下「12月」 */
.toolbar .m-btn { font-size: 14px !important; }

/* 字号变小后行高会跟着缩，给输入框一个固定高度把行高锁在 32px */
table.grid tbody td input { height: 30px; box-sizing: border-box; }
table#summary-table tbody td input { height: 30px; }

/* 输入框：字号小一号、灰字 */
input, select, textarea { font-size: 13px !important; }
input::placeholder, textarea::placeholder { color: #94a3b8 !important; }
/* 聚焦时文字加深，便于看清正在改什么 */
input:focus, textarea:focus { color: #0f172a !important; }

/* 流水「加载更多」行 */
tr.flow-more td.flow-more-td { padding: 10px; text-align: center; color: var(--primary); font-size: 12px; cursor: pointer; background: var(--bg-gray-light); }
tr.flow-more td.flow-more-td:hover { background: #f3f1fb; }
tr.flow-more td.flow-more-td b { text-decoration: underline; }

/* 固定表对齐：金额靠右、备注靠左、其余居中 */
table#fixed-table tbody td { text-align: center; height: 30px; }
table#fixed-table tbody tr { height: 30px; }
table#fixed-table thead th { height: 32px; }
table#fixed-table tbody td.col-amount { text-align: right; padding-right: 10px; }
table#fixed-table tbody td.col-note { text-align: left; padding-left: 8px; }
/* 表头一律居中（数据行才分左右） */
table#fixed-table thead th { text-align: center !important; padding-left: 6px !important; padding-right: 6px !important; }

/* 优先级要压过通用 input 样式（那些规则会把 width 拉成 100%） */
table#flow-table tbody td.col-note input.fixed-chk,
.fixed-chk {
  position: absolute !important;
  right: 4px !important;
  left: auto !important;
  top: 50% !important;
  transform: translateY(-50%) !important;
  width: 12px !important;
  min-width: 0 !important;
  max-width: 12px !important;
  height: 12px !important;
  margin: 0 !important;
  padding: 0 !important;
  border-radius: 2px;
  cursor: pointer;
  accent-color: var(--primary);
}
/* 备注输入框给右边两个按钮留出位置，文字不会被压住 */
table#flow-table tbody td.col-note > input:not(.fixed-chk) { padding-right: 38px; }

/* 空行：默认铺 100 行，整行高亮太吵，只把序号淡化以区分「还没落库的行」 */
table.grid tbody tr[data-new="1"] td.col-seq { color: var(--text-light); font-weight: 400; }
/* 账户名称列固定在左侧。表头那格要压在所有列之上（含 sticky 的其它 th），
   否则滚动时分类/简码的旧边框会从边上透出来，看着参差不齐。
   右缘补一道阴影当分隔线，盖掉底下列边框的 1px 残影。 */
table#summary-table thead th.col-name,
table#summary-table tbody td.col-name { position: sticky; z-index: 2; background-clip: padding-box; }
table#summary-table thead th.col-name { z-index: 6; }
/* 分类分组行那条跨四列的格子也一起固定 */
/* 分类分组行那条格子不固定：它 colspan=4，宽度是前四列之和，而数据行的账户名称只占 序号+名称，固定后会多盖住后面一截，把「当前结余」遮掉。让它照常跟着滚走。 */

/* 新增行（随手往下填的那几行）文字太浅，浅色主题下看不清 —— 统一用深紫，深色主题用白色 */
table.grid tbody tr[data-new="1"] td input,
table.grid tbody td.col-name input,
table.grid tbody td.col-code input,
table.grid tbody td.col-cat input,
table.grid tbody td.col-sub input,
table#summary-table tbody td input { color: #4c3d80 !important; }
[data-theme="dark"] table.grid tbody tr[data-new="1"] td input,
[data-theme="dark"] table.grid tbody td.col-name input,
[data-theme="dark"] table.grid tbody td.col-code input,
[data-theme="dark"] table.grid tbody td.col-cat input,
[data-theme="dark"] table.grid tbody td.col-sub input,
[data-theme="dark"] table#summary-table tbody td input { color: #ffffff !important; }
/* 账本区块（添加弹窗里的「账本」列表）：浅色用深紫，深色用白 */
.confirm-mask .book-name { color: #4c3d80 !important; }
.confirm-mask .book-title { color: #4c3d80 !important; }
[data-theme="dark"] .confirm-mask .book-name { color: #f0edf7 !important; }
[data-theme="dark"] .confirm-mask .book-title { color: #ffffff !important; }
/* 简码重复警告 */
table.grid td.col-code input.dup { color: var(--danger); font-weight: 700; background: #fee2e2; }



/* 数据体检：账户名重复、流水里引用了不存在的账户，都标红 */
table.grid td input.bad { color: var(--danger); font-weight: 700; background: #fee2e2; }
table#summary-table td.col-name input.dup { color: var(--danger); font-weight: 700; background: #fee2e2; }

/* 分类分组条：浅灰底、中灰字，只提示分组，不抢视线。
   分类名左对齐；右侧六列是该分类的合计（当前结余/转出/转入/转出历史/转入历史/期初），
   各自落在对应列上。账单日/还款日两格留空，但保留列网格线。
   背景必须带 !important —— table.grid tbody td 的特异性比 .cat-row td 高。 */
/* 分类分组行：整行深色底 + 白字，比浅灰底醒目得多 */
.cat-row td { background: var(--bar-bg)!important; color: var(--bar-text); font-weight: 700; font-size: 12px; padding: 7.5px 10px!important; text-align: left; border-bottom: 1px solid var(--bar-bg); }
/* 账单日 / 还款日那两格保持原样：浅色底 + 深色字，不参与分组行的深色填充 */
table#summary-table .cat-row td.col-bill,
table#summary-table .cat-row td.col-repay { background: transparent !important; color: var(--text-muted); }
.cat-row td .cat-col { color: var(--bar-text); }
/* 分组行的合计金额在深底上也要白字（否则沿用默认的深灰，看不清） */
.cat-row td.cat-sum { color: var(--bar-text); }
/* 标签格只有 32px，去掉内边距和字距，"资产"两个字才放得下 */
table#summary-table .cat-row td.cat-tag { padding: 0; letter-spacing: 0; }
.cat-row .cat-name { padding-left: 12px!important; }
/* 分组标签放进固定的序号格里：两个字、小字号，横向滚动时一直能看到 */
table#summary-table .cat-row td.cat-tag { font-size: 12px; font-weight: 700; color: var(--bar-text); padding: 0; white-space: nowrap; letter-spacing: -0.5px; }
.cat-row .cat-sum { text-align: right; font-variant-numeric: tabular-nums; padding-right: 6px!important; color: #475569; }
/* 分组行的期初右边框：所有行都有，和下面的数据行连成一条 */
table#summary-table .cat-row td.col-open { border-right: 1px solid var(--border-light); }

/* ==========================================
   4. 各页面列宽自适应规则 (按照截图比例微调)
   ========================================== */
/* 流水表 */
table#flow-table th.col-seq, table#flow-table td.col-seq { width: 54px; min-width: 54px; max-width: 54px; }
table#flow-table th.col-date, table#flow-table td.col-date { width: 14%; }
table#flow-table th.col-from, table#flow-table td.col-from { width: 20%; }
table#flow-table th.col-to, table#flow-table td.col-to { width: 20%; }
table#flow-table th.col-amount, table#flow-table td.col-amount { width: 16%; }
table#flow-table th.col-note, table#flow-table td.col-note { width: 24%; }

/* 汇总表 */
table#summary-table th.col-seq, table#summary-table td.col-seq { width: 54px; min-width: 54px; max-width: 54px; }
table#summary-table th.col-cat, table#summary-table td.col-cat { width: 8%; }
table#summary-table th.col-code, table#summary-table td.col-code { width: 7%; }
table#summary-table th.col-name, table#summary-table td.col-name { width: 15%; }
table#summary-table th.col-bal, table#summary-table td.col-bal { width: 11%; }
table#summary-table th.col-out, table#summary-table td.col-out { width: 8%; }
table#summary-table th.col-in, table#summary-table td.col-in { width: 8%; }
table#summary-table th.col-hout, table#summary-table td.col-hout { width: 8%; }
table#summary-table th.col-hin, table#summary-table td.col-hin { width: 8%; }
table#summary-table th.col-open, table#summary-table td.col-open { width: 8%; }
table#summary-table th.col-bill, table#summary-table td.col-bill { width: 6%; }
table#summary-table th.col-repay, table#summary-table td.col-repay { width: 9%; }
table#summary-table td input { font-size: 13px; padding: 6.5px 4px; }
/* 账单日靠右、还款日靠左，两个数字向中间的竖线收紧 */
table#summary-table td.col-bill input { text-align: right; padding: 6.5px 6px 6.5px 0; }
table#summary-table td.col-repay input { text-align: left; padding: 6.5px 0 6.5px 6px; }

/* 账单日 / 还款日：去掉横向分隔线；还款日列在最右端，也不画右边框。
   期初列的右边框所有行都保留（把账户主体和右侧空白分开）。 */
table#summary-table td.col-bill,
table#summary-table td.col-repay { border-bottom: none; }
table#summary-table td.col-repay { border-right: none; }
/* 两列中间那条竖线只有负债类才有（数据行和它自己的分组行） */
table#summary-table tr.debt-row td.col-bill,
table#summary-table .cat-row.debt-row td.col-bill { border-right: 1px solid var(--border-light); }
/* 其它分类的行和分组行：这两列一条竖线都不画 */
table#summary-table tbody tr:not(.debt-row):not(.cat-row) td.col-bill,
table#summary-table tbody tr:not(.debt-row):not(.cat-row) td.col-repay,
table#summary-table .cat-row:not(.debt-row) td.col-bill,
table#summary-table .cat-row:not(.debt-row) td.col-repay { border-right: none; }
/* 负债类分组行的这两格显示「账单日 / 还款日」两个列名，并让文字向中间竖线收紧；
   底边框交给通用的 td.col-bill / td.col-repay 规则（无底边框），这两格下方不画横线。 */
table#summary-table .cat-row.debt-row td.col-bill { text-align: right; padding: 7.5px 6px 7.5px 0!important; }
table#summary-table .cat-row.debt-row td.col-repay { text-align: left; padding: 7.5px 0 7.5px 6px!important; }
.cat-col { font-weight: 500; font-size: 11px; }
/* 其它分类的分组行：这两格完全空白，连边框都不画 */
table#summary-table .cat-row:not(.debt-row) td.col-bill,
table#summary-table .cat-row:not(.debt-row) td.col-repay { border-bottom: none; border-right: none; }
/* 表头这两格：白底、无边框，看起来不像列标题 */
table#summary-table th.col-bill,
table#summary-table th.col-repay { background: #fff; border-right: none; border-bottom: none; }

/* 查询区多栏并排：默认三等分，分割线可拖动调整 */
.query-dual { flex: 1; min-height: 0; display: flex; overflow: hidden; background: var(--bg-main); }
/* 三栏恒定三等分。表格宽度永远 100%，所以表格右边缘与栏的 border-right 严丝合缝，
   不会出现「分割线和备注列右边线不重叠」的错位。
   注意用 overflow: clip 而不是 hidden —— hidden 会把这栏变成"不滚动的滚动容器"，
   里面表头的 position:sticky 就会锚在栏上，跟着内容一起滚走；clip 只裁剪不建滚动容器，
   sticky 才能正确锚到真正滚动的 .grid-wrap。 */
.query-section { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--bg-dark); overflow: clip; position: relative; }
.query-section:last-child { border-right: none; }
.query-section .grid-wrap { flex: 1; overflow-y: auto; overflow-x: auto; }

table.query-table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
table.query-table th.col-seq, table.query-table td.col-seq { width: 6%; }
table.query-table th.col-date, table.query-table td.col-date { width: 15%; }
table.query-table th.col-from, table.query-table td.col-from { width: 18%; }
table.query-table th.col-to, table.query-table td.col-to { width: 18%; }
table.query-table th.col-amount, table.query-table td.col-amount { width: 17%; }
table.query-table th.col-note, table.query-table td.col-note { width: 26%; }

/* 整块 thead 一起吸顶：标题 → 筛选 → 列名三行始终可见。
   不能把 sticky 加在 th 上 —— table-cell 的包含块是它自己那一行（tr），
   高度与单元格相同就没有可移动空间，sticky 会失效。 */
table.query-table thead { position: sticky; top: 0; z-index: 5; }
table.query-table .q-title-row th { background: #fff; color: var(--text-main); padding: 4.5px 6px; border-bottom: 1px solid var(--border); text-align: center; }
.q-title-inner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 6px; min-height: 0; }
.q-title { font-size: 16px; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-total { font-size: 14px; font-weight: 700; color: var(--primary); white-space: nowrap; font-variant-numeric: tabular-nums; }
.q-clear { padding: 2px 8px; background: var(--bg-gray); border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
.q-clear:active { background: #fee2e2; color: var(--danger); }
.q-title .q-title-txt { margin-right: 4px; }

/* 查询区筛选行 */
table.query-table .q-filter-row th { background: var(--bg-gray-light); padding: 2.5px 3px; border-right: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); text-align: center; }
table.query-table .q-filter-row input { width: 100%; padding: 4px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; outline: none; text-align: center; }
table.query-table .q-filter-row input:focus { border-color: var(--primary); background: #f3f1fb; }

/* 列名行 */
table.query-table .q-head-row th { background: var(--bg-gray); color: var(--text-muted); padding: 7px 4px; text-align: center; font-size: 13px; font-weight: 700; white-space: nowrap; border-right: 1px solid var(--border-light); border-bottom: 1px solid var(--border); }
table.query-table tbody td { padding: 7px 6px; border-bottom: 1px solid var(--border-light); background: #fff; font-size: 13px; text-align: center; }
table.query-table tbody tr:nth-child(even) td { background: var(--bg-gray-light); }
table.query-table tbody td.col-seq { background: var(--bg-gray)!important; color: var(--text-muted); font-size: 12px; padding: 7px 2px; }
table.query-table tbody td.col-amount { text-align: right; font-weight: 600; color: var(--text-main); }
table.query-table tbody td.col-note { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
/* th 必须是定位元素，列宽把手（absolute）才有正确基准。
   之前把 sticky 从 th 移到 thead，th 变回 static，把手跑到表外面就拖不到了。 */
table.query-table thead th { position: relative; }

/* 每行最后一列（备注）不画右边框：这条竖线由栏自己的 border-right 承担，
   两者不能同时画，否则会错开 1px 变成双线。 */
table.query-table tr > th:last-child,
table.query-table tr > td:last-child { border-right: none; }

/* ==========================================
   通用确认框（破坏性操作前问一句，不用原生 confirm）
   ========================================== */
.confirm-mask { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
.confirm-box { background: #fff; border-radius: 8px; padding: 18px 20px; min-width: 300px; max-width: 420px; box-shadow: 0 12px 32px rgba(0, 0, 0, .22); }
.confirm-msg { font-size: 13px; color: var(--text-main); line-height: 1.7; margin-bottom: 16px; }
.confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }
.confirm-actions button { height: 28px; padding: 0 14px; border-radius: var(--radius); font-size: 13px; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--text-muted); font-weight: 600; }
.confirm-actions button[data-act="ok"] { background: var(--primary); color: #fff; border-color: var(--primary); }
.confirm-actions button:active { opacity: .85; }

/* 同步对话框 */
.sync-box { background: #fff; border-radius: 8px; padding: 18px 20px; width: 460px; max-width: 92vw; max-height: 88vh; overflow-y: auto; box-shadow: 0 12px 32px rgba(0, 0, 0, .22); }
.sync-title { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
.sync-hint { font-size: 12px; color: var(--text-muted); line-height: 1.6; margin-bottom: 14px; }
.sync-hint b { color: var(--text-main); }
.sync-block { display: flex; flex-direction: column; gap: 8px; }
.sync-block button { height: 28px; padding: 0 14px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--text-muted); align-self: flex-start; }
.sync-block button#sync-apply { background: var(--primary); color: #fff; border-color: var(--primary); }
.sync-block button:disabled { opacity: .45; cursor: not-allowed; }
.sync-code { width: 100%; height: 84px; resize: vertical; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 11px; font-family: ui-monospace, Consolas, monospace; color: var(--text-main); outline: none; word-break: break-all; line-height: 1.5; }
.sync-code:focus { border-color: var(--primary); }
.sync-or { text-align: center; font-size: 12px; color: var(--border); margin: 12px 0; }
.sync-actions { display: flex; justify-content: flex-end; margin-top: 14px; }
.sync-actions button { height: 28px; padding: 0 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--text-muted); }

/* ==========================================
   分期统计表（对应 Excel 里那张 2 行一组的表）
   ========================================== */
.toolbar.install-bar { gap: 8px; }
/* 按钮宽度和下面的月份输入框对齐（62px）；按钮组与起止区域之间留宽一点的间隔 */
.toolbar.install-bar > button { width: 62px; padding: 0; }
.toolbar.install-bar > .inst-label:first-of-type { margin-left: 16px; }
.inst-label { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.inst-input { width: 62px; height: 28px; padding: 0 6px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; text-align: center; outline: none; font-variant-numeric: tabular-nums; }
.inst-input:focus { border-color: var(--primary); background: #f3f1fb; }

/* 列宽必须硬性保底，否则月份列一多、浏览器就把「账户名称」压成几个字。
   用 min-width 而不是 table-layout:fixed —— 后者在 width:auto 下列宽会被均分掉。
   表格总宽 = 各列 min-width 之和，超出容器的部分由 .grid-wrap 横向滚动承接。 */
table.install-table { border-collapse: separate; border-spacing: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
table.install-table th, table.install-table td { padding: 0 6px; text-align: center; white-space: nowrap; overflow: hidden; height: 32px; border-right: 1px dashed #cbd5e1; }
table.install-table tr > th:last-child, table.install-table tr > td:last-child { border-right: none; }
table.install-table thead th { background: var(--bg-gray); color: var(--text-muted); font-weight: 700; font-size: 12px; line-height: 1.25; border-bottom: 1px solid var(--border); }
/* 表头固定成「文字 / 横线 / 文字」三行高度，不随内容伸缩 */
table.install-table thead th.col-name,
table.install-table thead th.col-day,
table.install-table thead th.col-sum { height: 64px; line-height: 1.35; }
table.install-table thead tr:nth-child(2) th { background: var(--bg-gray-light); font-weight: 600; }
table.install-table th.col-name, table.install-table td.col-name { width: 100px; min-width: 100px; text-align: center; }
/* 表头里用一条真正的横线代替斜杠 */
table.install-table thead th .th-line { display: block; height: 1px; background: var(--border); margin: 3px auto; width: 76%; }
/* 账户名称列固定在左侧：横向滚动看月份时不跟着滚走 */
table.install-table thead th.col-name { position: sticky; left: 0; z-index: 5; }
table.install-table tbody td.col-name { position: sticky; left: 0; z-index: 2; background: #fff; }
table.install-table th.col-day, table.install-table td.col-day { width: 40px; min-width: 40px; padding: 0 1px; }
/* 账单日/还款日表头缩到 34px 后要分三行才放得下 */
table.install-table thead th.col-day { font-size: 10.5px; line-height: 1.4; }
table.install-table th.col-sum, table.install-table td.col-sum { width: 74px; min-width: 74px; text-align: right; padding-right: 6px; position: relative; }
table.install-table .col-month { width: var(--inst-mw, 62px); min-width: var(--inst-mw, 62px); }
/* 表头文字一律居中（要压过下面 th.col-name 的左对齐） */
table.install-table thead th,
table.install-table thead th.col-name,
table.install-table thead th.col-day,
table.install-table thead th.col-sum { text-align: center; }
/* 月份格：单元格本身不带内边距，输入框铺满，点击范围更大 */
table.install-table td.col-month { padding: 0; }
table.install-table td.col-month input { width: 100%; height: 32px; border: none; background: transparent; text-align: right; padding: 0 6px; font-size: 13px; outline: none; font-variant-numeric: tabular-nums; color: var(--text-main); }
table.install-table td.col-month input:focus { background: #f3f1fb; }
/* 已还=绿色，未还=黑色（和原表的判定一致） */
table.install-table td.col-month.paid input { color: #00b050; }
table.install-table td.col-month.pending input { color: var(--text-main); }
/* 每列合计：暗红色；已经过去月份的合计转绿，一眼看出哪几个月已成历史 */
table.install-table th.inst-total { text-align: right; padding-right: 8px; color: #991b1b; background: var(--bg-gray-light); }
table.install-table th.inst-total.past { color: #00b050; }
/* 行线：组内用和流水表一样的 1px 细线；组与组之间的边界略粗一点（2px） */
table.install-table tbody td { border-bottom: 1px solid var(--border-light); }
table.install-table tbody tr.inst-i td { border-bottom: 2px solid var(--border); }
/* 本金行第一列：深灰蓝底 + 白字。
   取色过程：slate-700 #334155 = hsl(215, 25%, 26.7%) → 亮度 ×1.1、饱和度 ×1.1
   ≈ hsl(215, 27.5%, 29.4%) ≈ #364760。
   字号 12px —— 119px 的列宽减去左侧内边距和删除按钮，
   剩下的空间放 13px 会截断「招行信1007」。 */
/* 账户名称列：本金行深色底白字，利息行普通字；两行都居中 */
/* 账户名称列：本金行蓝底黑字（和标签栏同色），利息行普通字 */
table.install-table tr.inst-p td.col-name { background: transparent; }
table.install-table tr.inst-p td.col-name input { color: #7c5cff !important; font-weight: 700; }
/* 名称列收窄到 87px 后，13px 字号会把「招行信1007」截断，降一档到 11px 刚好完整 */
/* 名称字号和其它单元格一致（13px），列宽相应放宽到 100px */
table.install-table tbody td.col-name input { text-align: center; }
/* 分期金额那一行左侧给删除按钮留出位置 */
table.install-table tr.inst-i td.col-name input { padding-left: 16px; }
table.install-table td.col-name { position: relative; }
table.install-table td.col-name input { width: 100%; height: 30px; border: none; background: transparent; font-size: 13px; outline: none; padding: 0 2px; }
table.install-table td.col-name input:focus { background: rgba(255, 255, 255, .16); }
table.install-table tr.inst-i td.col-name input { font-weight: 700; text-align: right; }
table.install-table tr.inst-i td.col-name input:focus { background: #f3f1fb; }
/* 删除按钮：放在「每月合计」格靠左的位置。金额是右对齐的，左边本来就空着，
   这样它不再占用账户名称列的宽度。 */
.inst-del { position: absolute; left: 2px; top: 0; bottom: 0; width: 16px; border: none; background: none; color: var(--border); font-size: 15px; line-height: 1; cursor: pointer; }
.inst-del:active { background: #fee2e2; color: var(--danger); }
.install-empty { text-align: center; color: var(--text-muted); padding: 28px 0; font-size: 13px; }

/* ==========================================
   5. 工具栏与时间筛选
   ========================================== */
/* 三个页面的工具栏行高统一为 32px，和表格行、表头一致 */
.toolbar { position: relative; flex-shrink: 0; background: var(--bg-gray-light); border-bottom: 1px solid var(--border-light); padding: 0 12px; height: 32px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
/* 汇总页两条工具栏的右边界都到期初列右边框为止（--grid-right 由 JS 量出），
   去掉右内边距，内容右缘才能和那条线严丝合缝：
   第一行的「导出/导入」和第二行的统计区间因此落在同一条竖线上。
   桌面上 7-12 月只占一行，所以第二行仍是 32px；手机月份排两排才由内容撑开。 */
.toolbar.bar1, .toolbar.bar2 { max-width: var(--grid-right, 100%); padding-right: 0; }
/* 第一行工具栏不画底边框：和第二行同为浅灰底，连成一块更干净 */
.toolbar.bar1 { border-bottom: none; }
/* 「区间 / 月份」两个切换按钮也收窄，和月份格子的宽度接近 */
/* 「区间 / 月份」按钮固定宽度，两个按钮 + 间隙 = 年份框宽度，两排左边界自然对齐 */
/* 月份 / 区间 / 清空 / 打印 和年份框统一 44px，横向间距压到 4px */
.toolbar.bar1 > button, .toolbar.bar2 > button { width: 44px; padding: 0; flex: 0 0 44px; }
.toolbar.bar1, .toolbar.bar2 { gap: 4px; }
.toolbar.bar1 .month-row, .toolbar.bar2 .month-row { gap: 4px; }
/* 年份框宽度 = 44 × 2 + 8 = 96 */
.toolbar.bar1 .year-input { width: 44px; }
/* 年份框在工具栏里绝对居中（flex 的 auto 边距只会平分「按钮右侧」的余量，不是真居中）。
   绝对定位后它不是 flex item，flex-basis 失效，必须显式给宽度，否则会撑满并盖住按钮。 */
/* 年份框改成普通 flex 项：绝对定位居中会盖住 9 月、10 月 */
/* 年份框和按钮同宽，留在第一行「月份」和 1 月之间 */
.toolbar.bar1 .year-input { position: static; transform: none; width: 44px; flex: 0 0 44px; padding: 0 2px; text-align: center; }
/* 区间模式：两个日期输入框各占一半，中间一个 ~ 分隔 */
.toolbar.bar2 .grow { flex: 1 1 0; min-width: 0; font-size: 12px; padding: 0 7px; }
.toolbar.bar2 .tilde { flex: 0 0 auto; color: var(--text-muted); }
/* 月份模式：两条工具栏的左右留白统一成 4px，两排月份才能左右对齐 */
.toolbar.bar1, .toolbar.bar2 { padding-left: 4px; padding-right: 4px; }
/* 下排月份要和上排左边界对齐。
   上排月份起点 = 4 + 48(区间) + 8 + 48(月份) + 8 = 116px
   下排起点 = 4 + 年份框宽 + 8 + 补偿，所以补偿 = 104 - 年份框宽（桌面 96px → 8px） */
/* 区间模式的两个日期框在桌面上固定半宽（原来会平分整行），窄屏再让它自适应 */
.toolbar .grow { flex: 0 0 210px; min-width: 0; }
/* 流水页这一行同样 32px，标题与按钮在行内垂直居中。
   高度宽度都对齐表格：右边界到备注列右缘；左内边距压到 4px，按钮尽量贴左。
   标题是绝对定位、left:0 起算，所以不受这个内边距影响，仍然居中于表格宽度。 */
.toolbar.flow-bar { padding: 0 0 0 4px; height: 32px; max-width: var(--flow-right, 100%); }
/* 页面标题：与「流水查询」同字号同字重。居中范围是表格的实际宽度（到备注列右缘为止），
   不是整个窗口 —— 列宽被拖窄后右边会留白，标题也跟着往左收。宽度由 syncFlowTitleWidth 写入。 */
.bar-title { position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: var(--title-w, 100%); text-align: center; font-size: 16px; font-weight: 700; color: var(--text-main); pointer-events: none; }
/* 流水页标题：绝对定位，在「左边缘 → 备注列右边缘」这段区域里水平居中 */
.flow-title { position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: var(--flow-title-w, 100%); text-align: center; font-size: 16px; font-weight: 700; color: var(--text-main); white-space: nowrap; pointer-events: none; }
/* 工具栏内的按钮、输入框统一高度 28px（border-box 含边框），
   否则带边框的 ghost 按钮会比月份按钮高出几个像素，同一行看起来参差不齐 */
.toolbar input { height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; outline: none; }
.toolbar input:focus { border-color: var(--primary); }
.toolbar button { height: 28px; padding: 0 12px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; cursor: pointer; font-weight: 600; }
.toolbar button.ghost { background: #fff; color: var(--text-muted); border: 1px solid var(--border); }
.toolbar button[data-active="true"] { background: var(--primary); color: #fff; border-color: var(--primary); }

/* 月份选择器横轴 */
.month-bar { display: flex; align-items: flex-start; gap: 8px; width: 100%; overflow-x: auto; padding-bottom: 0; }
.month-bar::-webkit-scrollbar { height: 0; }
/* 年份框右边缘要对齐「月份」按钮的右边缘。按钮宽度随内边距变化（62 → 54 就错过一次），
   宽度由 CSS flex 自适应，这里的值是首帧兜底。
   必须带 min-width:0 —— input 默认 size=20 的固有宽度会被 flex 的
   min-width:auto 当成下限，否则 flex-basis 会被顶到 200px 宽。 */
.year-input { flex: 0 0 96px; min-width: 0; height: 28px; padding: 0; font-size: 14px; font-weight: 700; text-align: center; border: 1px solid var(--border); border-radius: var(--radius); }
/* 月份排成两行：1-6 月在第一行、7-12 月在第二行，两行的左边缘自动对齐。
   桌面上第一行直接占用「区间/月份 + 导出/导入」那一行，所以不额外增加行高；
   手机上 12 个都挤在第二行排两排。 */
/* 6 月一组（两行各 6 个），桌面固定 46px，手机按可用宽度均分 */
.month-row { display: grid; grid-template-columns: repeat(6, 46px); gap: 6px; flex: 0 0 auto; }
.month-row .m-suf { display: inline; }
/* 注意特异性：这几条必须用 .month-row .m-btn（0,2,0）压过 .toolbar button（0,1,1），
   否则月份按钮会被工具栏那条"主按钮"规则刷成蓝底，导致 12 个月份全是选中态。 */
/* 12 个月按钮统一宽度，按「12月」这种三位内容定尺寸，个位数月份不再窄一截 */
.month-row .m-btn { flex: 0 0 46px; width: 46px; min-width: 0; height: 28px; padding: 0; font-size: 13px; font-weight: 600; background: #fff; color: var(--text-main); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; text-align: center; }
.month-row .m-btn[data-active="true"] { background: var(--primary); color: #fff; border-color: var(--primary); }
.month-row .m-btn:active { background: #dbeafe; }
.month-row .m-btn[data-active="true"]:active { background: var(--primary-dark); }

.range-inline { flex: 0 0 auto; margin-left: auto; display: inline-flex; align-items: center; height: 28px; padding: 0 12px; font-size: 13px; font-weight: 600; color: var(--primary-dark); background: #f3f1fb; border-radius: var(--radius); }

/* ==========================================
   6. 页面动画与空状态
   ========================================== */
.empty-state { text-align: center; color: var(--text-light); padding: 60px 20px; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty-state svg { width: 48px; height: 48px; fill: var(--border); }
/* 注意：.empty-state 是 flex 布局，套在 <td> 上会让内容脱离表格单元格的正常流、
   把一行字挤成竖排，所以空行用这个普通样式 */
td.query-empty { text-align: center; color: var(--text-light); padding: 40px 12px !important; }

/* ==========================================
   7. 窄屏适配（手机）
   ------------------------------------------------------------
   桌面端（≥768px）的列宽百分比完全不动，这里只在窄屏补一套保底规则：
   · 流水表 / 汇总表给最小宽度，宁可横向滚动，也不把金额压成 "¥..."
   · 查询页两栏在窄屏改为上下堆叠（半屏塞 6 列物理上不可能）
   · 查询标题行精简为 "A" / "B"，给合计腾出位置
   ========================================== */
@media (max-width: 767px) {
  .grid-wrap { overflow-x: auto; }

  /* 窄屏：12 个月挤在一行，均分可用宽度；「月」字去掉只留数字，否则「10月」放不下 */
  .month-bar { flex-wrap: wrap; row-gap: 4px; }
  /* 窄屏：6 个格子均分剩余宽度（宽度必须由 flex 撑开，minmax(0,1fr) 才有基准） */
  .month-row { flex: 1 1 auto; min-width: 0; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
  /* 下排空出「区间 + 月份」两个按钮的宽度，让两排的月份格子左右对齐、宽度一致 */
  .month-row .m-btn { width: auto; min-width: 0; font-size: 11px; padding: 0; }
  .toolbar .grow { flex: 1 1 0; }
  .month-bar .range-inline { flex: 1 1 100%; margin-left: 0; text-align: right; }
  .toolbar.bar2 { height: auto; min-height: 32px; padding-top: 3px; padding-bottom: 3px; align-items: flex-start; }

  /* 流水表：日期 6 位、金额 8 字符都要放得下 */
  table#flow-table { min-width: 560px; }

  /* 汇总表：13 列，保底 800px */
  table#summary-table { min-width: 800px; }
  /* 之前是 10px，把行高从 32 撑到 38；改成 6.5px 和桌面一致，行高稳定在 32 */
  table#summary-table td input { font-size: 13px; padding: 6.5px 4px; }
  /* 窄屏下重分配列宽：13 列挤在 800px 里，金额列必须拿到足够像素，
     否则 ¥-1,034.56 会被省略成 "¥-1,034..."（桌面端百分比不动） */
  table#summary-table thead th { padding: 8px 2px; font-size: 12px; }
  table#summary-table th.col-seq,   table#summary-table td.col-seq   { width: 5%; }
  table#summary-table th.col-cat,   table#summary-table td.col-cat   { width: 8%; }
  table#summary-table th.col-code,  table#summary-table td.col-code  { width: 5%; }
  table#summary-table th.col-name,  table#summary-table td.col-name  { width: 13%; }
  table#summary-table th.col-bal,   table#summary-table td.col-bal   { width: 13%; }
  table#summary-table th.col-out,   table#summary-table td.col-out,
  table#summary-table th.col-in,    table#summary-table td.col-in,
  table#summary-table th.col-hout,  table#summary-table td.col-hout,
  table#summary-table th.col-hin,   table#summary-table td.col-hin  { width: 9%; }
  table#summary-table th.col-open,  table#summary-table td.col-open  { width: 9%; }
  table#summary-table th.col-bill,  table#summary-table td.col-bill { width: 5%; }
  table#summary-table th.col-repay, table#summary-table td.col-repay { width: 7%; }

  /* 查询页：三栏继续横向排列，整块左右滚动查看（不再上下堆叠） */
  .query-dual { flex-direction: row; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; }
  /* 每栏占视口 92%，右侧露出一点下一栏，提示可以左右滑；滑动后吸附到整栏 */
  .query-section { flex: 0 0 100% !important; width: 100%; scroll-snap-align: start; }
  table.query-table { min-width: 0; }

  /* 查询标题行精简（标题文字保留，手机上也能看出是 A/B/C 哪一栏） */
  .q-title { font-size: 13px; }
  .q-total { font-size: 12px; }
  .q-clear { font-size: 11px; padding: 3px 7px; }
  table.query-table .q-title-row th { padding: 5px; }
  table.query-table .q-filter-row th { padding: 3px; }
  table.query-table .q-filter-row input { font-size: 11px; padding: 6px 2px; }
  table.query-table .q-head-row th { font-size: 11px; padding: 6.5px 2px; }
  table.query-table tbody td { font-size: 12px; padding: 6.5px 4px; }
  table.query-table tbody td.col-seq { padding: 6.5px 2px; }

  /* 汇总页时间行：年份框给个固定宽度（否则 JS 量出来的宽度会把整行撑散），
     具体日期区间在手机上不显示，省出一行给表格。 */
  /* 窄屏：按钮 34px × 2 + 8 = 年份框 76px，两排同样对齐 */
  .toolbar.bar1 > button { width: 34px; font-size: 12px; }
  .year-input { flex: 0 0 76px; width: 76px; }
  .month-bar .range-inline { display: none; }

  /* 流水 / 分期两页的标题：手机上改成左对齐放在最前，不再绝对定位居中（会和按钮叠字） */
  .toolbar.flow-bar .flow-title { position: static; transform: none; width: auto; flex: 0 0 auto; text-align: left; font-size: 14px; padding-left: 0; }
  /* 分期页标题在窄屏也改成左对齐放在最前 */
  .toolbar.install-bar .bar-title { position: static; transform: none; width: auto; flex: 0 0 auto; order: -1; text-align: left; font-size: 14px; padding-right: 0; margin-right: 3em; }
  .toolbar.flow-bar { padding-left: 8px; }
  /* 分期页：标题 + 新增 + 复制 + 起 + 止 要塞进 390px，尺寸统一收一档，否则「止」会被挤到第二行 */
  .toolbar.install-bar { flex-wrap: wrap; height: auto; min-height: 32px; padding: 2px 8px; gap: 6px; }
  .toolbar.install-bar .bar-title { font-size: 14px; margin-right: 3em; }
  .toolbar.install-bar > button { width: 56px; }
  .toolbar.install-bar .inst-input { width: 46px; padding: 0 2px; font-size: 12px; }
  .toolbar.install-bar .inst-label { gap: 3px; font-size: 11px; }
  .toolbar.install-bar .bar-title { margin-right: 10px !important; }
  .toolbar.install-bar > button { width: 40px; flex: 0 0 40px; padding: 0; }
  .toolbar.install-bar > .inst-label:first-of-type { margin-left: 0; }
}

/* ==========================================
   8. 列宽拖拽（Excel 式）
   ------------------------------------------------------------
   · 拖拽表头右边缘的把手调整列宽
   · 双击把手：按该列最宽内容自动适应
   · 右键表头 / 页脚「重置列宽」：恢复默认百分比
   未自定义时完全沿用上面的响应式百分比；一旦拖过，该表改用
   <colgroup> 的固定像素宽度，总宽 = 各列之和，窄了就横向滚动。
   ========================================== */
/* 表头有 overflow:hidden，把手放到 right:-3px 会被裁掉，所以完全落在格子内 */
.col-resizer { position: absolute; top: 0; bottom: 0; right: 0; width: 8px; cursor: col-resize; z-index: 6; touch-action: none; }
.col-resizer::after { content: ''; position: absolute; top: 25%; bottom: 25%; left: 3px; width: 2px; border-radius: 1px; background: transparent; transition: background .15s; }
.col-resizer:hover::after, .col-resizer.dragging::after { background: var(--primary); }
/* 触屏上 8px 太难点中，加宽命中区，并让把手常显（触屏没有 hover，否则用户以为没这功能） */

  .col-resizer.dragging::after { background: var(--primary); }
}

/* 自定义列宽后，宽度由各列之和决定，不再被响应式 min-width 与百分比干扰 */
table.cols-custom { min-width: 0 !important; width: auto; }

/* 页脚只保留一行文本 */
footer { position: relative; }

/* 轻提示：不打断操作，几秒后自己消失，可带一个撤销按钮 */
.toast { position: fixed; left: 50%; bottom: 58px; transform: translate(-50%, 14px); max-width: calc(100vw - 28px); padding: 10px 14px; border-radius: 8px; background: rgba(15, 23, 42, .95); color: #fff; font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(15, 23, 42, .32); opacity: 0; pointer-events: none; transition: opacity .16s ease, transform .16s ease; z-index: 9999; display: flex; align-items: center; gap: 10px; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast.error { background: rgba(185, 28, 28, .96); }
.toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast button { flex: 0 0 auto; padding: 3px 10px; border: 1px solid rgba(255, 255, 255, .45); border-radius: 4px; background: transparent; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
.toast button:active { background: rgba(255, 255, 255, .22); }
/* ============================================================
   最终覆盖层：放在样式表最后，保证这三类行不被任何前面的规则拆开
   ============================================================ */
/* 1. 分类分组行：整行同色 */
[data-theme="dark"] table.grid tbody tr.cat-row > td,
[data-theme="dark"] table.grid tbody tr.cat-row > td.col-seq,
[data-theme="dark"] table.grid tbody tr.cat-row > td.col-name,
[data-theme="dark"] table.grid tbody tr.cat-row > td.col-bill,
[data-theme="dark"] table.grid tbody tr.cat-row > td.col-repay,
html[data-theme="dark"] table.grid tbody tr.cat-row:nth-child(odd) > td,
html[data-theme="dark"] table.grid tbody tr.cat-row:nth-child(even) > td {
  background-color: transparent !important;
  background-image: none !important;
}
/* 2. 分期利息行：整行同色（跟随斑马纹） */
[data-theme="dark"] table.install-table tbody tr.inst-i:nth-child(odd) > td,
[data-theme="dark"] table.install-table tbody tr.inst-i:nth-child(odd) > td.col-name {
  background-color: #0d0d0d !important;
}
[data-theme="dark"] table.install-table tbody tr.inst-i:nth-child(even) > td,
[data-theme="dark"] table.install-table tbody tr.inst-i:nth-child(even) > td.col-name {
  background-color: #1a1a1a !important;
}
/* 分期「账户名称」列：底色完全跟随所在行，不再单独着色；文字用亮紫区分本金/利息 */
[data-theme="dark"] table.install-table tr.inst-p > td.col-name,
[data-theme="dark"] table.install-table tr.inst-p:nth-child(odd) > td.col-name { background-color: #0d0d0d !important; }
[data-theme="dark"] table.install-table tr.inst-p:nth-child(even) > td.col-name { background-color: #1a1a1a !important; }
[data-theme="dark"] table.install-table tr.inst-p > td.col-name input,
[data-theme="dark"] table.install-table tr.inst-p > td.col-name input:focus { color: #b9a6ff !important; font-weight: 700; }
[data-theme="dark"] table.install-table tr.inst-i > td.col-name input,
[data-theme="dark"] table.install-table tr.inst-i > td.col-name input:focus { color: #ffffff !important; }
/* 浅色主题：同一列用深一点的紫，保证可读 */
table.install-table tr.inst-p > td.col-name,
table.install-table tr.inst-p > td.col-name input { background-color: transparent !important; color: #6b4fe0 !important; font-weight: 700; }
/* 汇总的分类标签行（资产/费用…）：底色不再单独区分，跟随所在行的斑马纹；
   只用亮紫字区分它是分组标题 */
[data-theme="dark"] table#summary-table tbody tr.cat-row > td,
[data-theme="dark"] table#summary-table tbody tr.cat-row > td.col-seq,
[data-theme="dark"] table#summary-table tbody tr.cat-row > td.col-name,
[data-theme="dark"] table#summary-table tbody tr.cat-row > td.col-bill,
[data-theme="dark"] table#summary-table tbody tr.cat-row > td.col-repay,
[data-theme="dark"] table#summary-table tbody tr.cat-row:nth-child(odd) > td {
  background-color: #0d0d0d !important;
  color: #b9a6ff !important;
}
[data-theme="dark"] table#summary-table tbody tr.cat-row:nth-child(even) > td {
  background-color: #1a1a1a !important;
  color: #b9a6ff !important;
}
[data-theme="dark"] table#summary-table tbody tr.cat-row td.cat-tag,
[data-theme="dark"] table#summary-table tbody tr.cat-row td.cat-sum,
[data-theme="dark"] table#summary-table tbody tr.cat-row td.col-bal,
[data-theme="dark"] table#summary-table tbody tr.cat-row td .cat-col {
  color: #b9a6ff !important;
}
[data-theme="dark"] table#summary-table tbody tr.cat-row td.col-bill,
[data-theme="dark"] table#summary-table tbody tr.cat-row td.col-repay { color: #8e7fd0 !important; }
/* 浅色主题同样：分组行不着色，只用紫字 */
table#summary-table tbody tr.cat-row > td,
table#summary-table tbody tr.cat-row > td.cat-tag,
table#summary-table tbody tr.cat-row > td.cat-sum,
table#summary-table tbody tr.cat-row > td .cat-col {
  background-color: transparent !important;
  color: #6b4fe0 !important;
}
/* ============================================================
   最终规则（压倒一切前面的定义）
   ============================================================ */
/* 1. 分期「账户名称」列回到 深紫底 + 白字 */
[data-theme="dark"] table.install-table tbody tr.inst-p > td.col-name,
[data-theme="dark"] table.install-table tbody tr.inst-p:nth-child(odd) > td.col-name,
[data-theme="dark"] table.install-table tbody tr.inst-p:nth-child(even) > td.col-name {
  background-color: #2a2140 !important;
}
[data-theme="dark"] table.install-table tbody tr.inst-p > td.col-name input,
[data-theme="dark"] table.install-table tbody tr.inst-p > td.col-name input:focus {
  color: #ffffff !important;
  font-weight: 700;
}
/* 利息行的名称列仍跟随斑马纹 */
[data-theme="dark"] table.install-table tbody tr.inst-i:nth-child(odd) > td.col-name { background-color: #0d0d0d !important; }
[data-theme="dark"] table.install-table tbody tr.inst-i:nth-child(even) > td.col-name { background-color: #1a1a1a !important; }
/* 浅色主题同步：本金行深紫底白字 */
table.install-table tbody tr.inst-p > td.col-name { background-color: #2a2140 !important; }
table.install-table tbody tr.inst-p > td.col-name input { color: #ffffff !important; font-weight: 700; }

/* 2. 汇总分类行：包括「账户名称」在内的每一格都必须和所在行同色 */
[data-theme="dark"] table#summary-table tbody tr.cat-row:nth-child(odd) > td,
[data-theme="dark"] table#summary-table tbody tr.cat-row:nth-child(odd) > td.col-seq,
[data-theme="dark"] table#summary-table tbody tr.cat-row:nth-child(odd) > td.col-name,
[data-theme="dark"] table#summary-table tbody tr.cat-row:nth-child(odd) > td.cat-tag {
  background-color: #0d0d0d !important;
  background-image: none !important;
}
[data-theme="dark"] table#summary-table tbody tr.cat-row:nth-child(even) > td,
[data-theme="dark"] table#summary-table tbody tr.cat-row:nth-child(even) > td.col-seq,
[data-theme="dark"] table#summary-table tbody tr.cat-row:nth-child(even) > td.col-name,
[data-theme="dark"] table#summary-table tbody tr.cat-row:nth-child(even) > td.cat-tag {
  background-color: #1a1a1a !important;
  background-image: none !important;
}
/* ============================================================
   工具栏统一间距：标题与第一个按钮之间 2 个英文字符宽，其余等间隔
   ============================================================ */
.toolbar.flow-bar,
.toolbar.install-bar,
.toolbar.bar1,
.toolbar.bar2 {
  gap: 2ch;
}
/* 标题后面再多让 2ch（gap 已经 2ch，所以标题单独不再加 margin） */
.toolbar.flow-bar .flow-title,
.toolbar.flow-bar .bar-title,
.toolbar.install-bar .bar-title,
.fixed-title {
  margin-right: 0 !important;
}
/* 月份格子保持紧凑，不参与 2ch 大间隔（12 个月放不下） */
.toolbar.bar1 .month-row,
.toolbar.bar2 .month-row { gap: 4px; }
/* 窄屏：流水页有 5 个按钮 + 标题，需要收紧才放得下 */
@media (max-width: 767px) {
  .toolbar.flow-bar { gap: 1.5ch; padding-left: 4px; padding-right: 4px; }
  .toolbar.flow-bar > button { width: 40px !important; flex: 0 0 40px !important; padding: 0 !important; }
  .toolbar.flow-bar .flow-title { margin-right: 0 !important; font-size: 14px; }
}
/* ============================================================
   流水页最终调整
   ============================================================ */
/* 1) 标题后再加 2ch（叠加在 gap 之上） */
.toolbar.flow-bar .flow-title { margin-right: 2ch !important; }
/* 2) 按钮间距减半：宽屏 2ch → 1ch，窄屏 1.5ch → 0.75ch */
.toolbar.flow-bar { gap: 1ch !important; }
@media (max-width: 767px) {
  .toolbar.flow-bar { gap: 0.75ch !important; }
}
/* 3) 编辑中的单元格必须变淡：特异性压过所有斑马纹 / 冻结列规则 */
[data-theme="dark"] table.grid tbody tr > td:focus-within,
[data-theme="dark"] table.grid tbody tr:nth-child(odd) > td:focus-within,
[data-theme="dark"] table.grid tbody tr:nth-child(even) > td:focus-within,
[data-theme="dark"] table.grid tbody tr > td.col-seq:focus-within,
[data-theme="dark"] table#summary-table tbody tr > td.col-name:focus-within,
[data-theme="dark"] table.query-table tbody tr > td:focus-within {
  background-color: #333333 !important;
  box-shadow: inset 0 0 0 1px #6b5bc4;
}
/* 浅色主题：聚焦单元格给一层淡紫底，也能看出正在编辑 */
table.grid tbody tr > td:focus-within,
table.query-table tbody tr > td:focus-within {
  background-color: #f3f1fb !important;
  box-shadow: inset 0 0 0 1px #b9a6ff;
}
/* ============================================================
   汇总页：年份框 / 区间日期框 和按钮同一套外观
   ============================================================ */
.toolbar.bar1 .year-input,
.toolbar.bar2 .year-input,
.toolbar.bar2 .grow {
  background-color: var(--bg-main);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  height: 26px;
  box-sizing: border-box;
  font-size: 13px;
  text-align: center;
  padding: 0 6px;
  color: var(--text-main);
}
.toolbar.bar1 .year-input:focus,
.toolbar.bar2 .year-input:focus,
.toolbar.bar2 .grow:focus {
  border-color: var(--primary);
  outline: none;
}
/* 暗色下按钮是 #1a1a1a 深底 + #333 描边，输入框照抄 */
[data-theme="dark"] .toolbar.bar1 .year-input,
[data-theme="dark"] .toolbar.bar2 .year-input,
[data-theme="dark"] .toolbar.bar2 .grow {
  background-color: #1a1a1a !important;
  border: 1px solid #333333 !important;
  border-radius: 4px !important;
  color: #ffffff !important;
  font-size: 13px !important;
}
[data-theme="dark"] .toolbar.bar1 .year-input:focus,
[data-theme="dark"] .toolbar.bar2 .year-input:focus,
[data-theme="dark"] .toolbar.bar2 .grow:focus {
  border-color: var(--primary) !important;
}
/* ============================================================
   查询表「表头筛选行」的输入框：和按钮同一套外观
   ============================================================ */
table.query-table thead th input,
table.query-table tr.q-filter-row input {
  background-color: var(--bg-main);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  height: 26px;
  box-sizing: border-box;
  font-size: 13px;
  text-align: center;
  padding: 0 4px;
  color: var(--text-main);
  width: 100%;
}

  align-items: center !important;
  flex-wrap: nowrap !important;
  gap: 5px !important;
  padding: 4px 6px !important;
  width: 100% !important;
  max-width: 100% !important;
  height: auto !important;
  min-height: 34px !important;
  box-sizing: border-box !important;
  overflow: hidden !important;
}
.toolbar.plan-bar > .flow-title {
  position: static !important;
  flex: 0 0 auto !important;
  width: auto !important;
  min-width: 0 !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 2px 0 0 !important;
  font-size: 14px !important;
  white-space: nowrap !important;
  text-align: left !important;
  transform: none !important;
}
.toolbar.plan-bar > button.plan-btn {
  flex: 0 0 auto !important;
  width: auto !important;
  min-width: 0 !important;
  max-width: none !important;
  height: 28px !important;
  padding: 0 9px !important;
  font-size: 13px !important;
  white-space: nowrap !important;
  box-sizing: border-box !important;
}
.toolbar.plan-bar > input.year-input {
  flex: 0 0 54px !important;
  width: 54px !important;
  min-width: 54px !important;
  max-width: 54px !important;
  height: 28px !important;
  padding: 0 2px !important;
  font-size: 13px !important;
  text-align: center !important;
  box-sizing: border-box !important;
  border: 1px solid var(--border) !important;
  border-radius: 5px !important;
  background: var(--bg-main) !important;
}
/* 月份 / 年份 格子：12 列或 4 列 */
.toolbar.plan-bar2 > .month-row {
  flex: 1 1 0 !important;
  min-width: 0 !important;
  display: grid !important;
  grid-template-columns: repeat(12, minmax(0, 1fr)) !important;
  gap: 2px !important;
}
.toolbar.plan-bar2 > .month-row.plan-years {
  grid-template-columns: repeat(auto-fit, minmax(0, 1fr)) !important;
  gap: 6px !important;
}
.toolbar.plan-bar2 > .month-row .m-btn {
  width: 100% !important;
  min-width: 0 !important;
  max-width: none !important;
  height: 26px !important;
  padding: 0 !important;
  font-size: 12px !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  box-sizing: border-box !important;
}
.toolbar.plan-bar2 > input.grow {
  flex: 1 1 0 !important;
  min-width: 0 !important;
  height: 28px !important;
  box-sizing: border-box !important;
  font-size: 13px !important;
}
.toolbar.plan-bar2 > .tilde { flex: 0 0 auto !important; font-size: 13px !important; }
/* 区间输入：年/月/日 三段 */
.toolbar.plan-bar2 > .range-group {
  display: flex !important;
  align-items: center !important;
  gap: 1px !important;
  flex: 1 1 0 !important;
  min-width: 0 !important;
}
.toolbar.plan-bar2 > .range-group > input {
  flex: 1 1 0 !important;
  min-width: 0 !important;
  height: 28px !important;
  padding: 0 2px !important;
  font-size: 13px !important;
  text-align: center !important;
  box-sizing: border-box !important;
  border: 1px solid var(--border) !important;
  border-radius: 4px !important;
  background: var(--bg-main) !important;
}
.toolbar.plan-bar2 > .range-group > input.plan-y,
.toolbar.plan-bar2 > .range-group > input.plan-y2 { flex: 0 0 42px !important; width: 42px !important; }
.toolbar.plan-bar2 > .range-group > input.plan-mo,
.toolbar.plan-bar2 > .range-group > input.plan-mo2,
.toolbar.plan-bar2 > .range-group > input.plan-d,
.toolbar.plan-bar2 > .range-group > input.plan-d2 { flex: 0 0 30px !important; width: 30px !important; }
.toolbar.plan-bar2 > .range-group > i {
  flex: 0 0 auto !important;
  font-style: normal !important;
  font-size: 12px !important;
  color: var(--text-muted) !important;
  padding: 0 1px !important;
}
/* 区间输入：三段数字 + 破折号，整体看起来就是一个 2026-08-01 */
.toolbar.plan-bar2 > .range-group {
  display: flex !important;
  align-items: center !important;
  gap: 0 !important;
  flex: 0 0 auto !important;
  min-width: 0 !important;
  height: 28px !important;
  padding: 0 4px !important;
  box-sizing: border-box !important;
  border: 1px solid var(--border) !important;
  border-radius: 5px !important;
  background: var(--bg-main) !important;
  overflow: hidden !important;
}
.toolbar.plan-bar2 > .range-group > input {
  flex: 0 0 auto !important;
  height: 26px !important;
  padding: 0 !important;
  margin: 0 !important;
  font-size: 14px !important;
  text-align: center !important;
  box-sizing: border-box !important;
  border: none !important;
  border-radius: 0 !important;
  background: transparent !important;
  color: var(--text-main) !important;
  outline: none !important;
  -webkit-appearance: none !important;
  appearance: none !important;
  box-shadow: none !important;
}
.toolbar.plan-bar2 > .range-group > input:focus { background: var(--cell-active) !important; border-radius: 3px !important; }
.toolbar.plan-bar2 > .range-group > input.plan-y,
.toolbar.plan-bar2 > .range-group > input.plan-y2 { width: 48px !important; }
.toolbar.plan-bar2 > .range-group > input.plan-mo,
.toolbar.plan-bar2 > .range-group > input.plan-mo2 { width: 32px !important; }
.toolbar.plan-bar2 > .range-group > input.plan-d,
.toolbar.plan-bar2 > .range-group > input.plan-d2 { width: 32px !important; }
.toolbar.plan-bar2 > .range-group > i.dash {
  flex: 0 0 auto !important;
  font-style: normal !important;
  font-size: 14px !important;
  color: var(--text-light) !important;
  padding: 0 2px !important;
  user-select: none !important;
}
.toolbar.plan-bar2 > .range-group > input:placeholder-shown { color: var(--text-light) !important; }
/* 月份/年份 格子：固定宽度、靠左排列，不随窗口拉长 */
.toolbar.plan-bar2 > .month-row {
  flex: 0 0 auto !important;
  display: flex !important;
  flex-wrap: wrap !important;
  gap: 3px !important;
  max-width: none !important;
}
.toolbar.plan-bar2 > .month-row .m-btn {
  flex: 0 0 40px !important;
  width: 40px !important;
  min-width: 40px !important;
  max-width: 40px !important;
  height: 28px !important;
  padding: 0 !important;
  font-size: 13px !important;
  box-sizing: border-box !important;
}
.toolbar.plan-bar2 > .month-row.plan-years .m-btn {
  flex: 0 0 62px !important;
  width: 62px !important;
  min-width: 62px !important;
  max-width: 62px !important;
  font-size: 13px !important;
}
/* 区间单框 */
.toolbar.plan-bar2 > input.plan-start,
.toolbar.plan-bar2 > input.plan-end {
  flex: 1 1 0 !important;
  min-width: 0 !important;
  height: 28px !important;
  padding: 0 8px !important;
  font-size: 14px !important;
  box-sizing: border-box !important;
  border: 1px solid var(--border) !important;
  border-radius: 5px !important;
  background: var(--bg-main) !important;
  color: var(--text-main) !important;
}
/* 第二行工具栏允许换行，格子靠左排，不撑破屏宽 */
.toolbar.plan-bar2 {
  flex-wrap: wrap !important;
  align-items: flex-start !important;
  height: auto !important;
  overflow: visible !important;
  padding-bottom: 5px !important;
}
.toolbar.plan-bar2 > .month-row {
  flex: 0 0 auto !important;
  display: flex !important;
  flex-wrap: wrap !important;
  gap: 3px !important;
  width: auto !important;
  max-width: 100% !important;
  justify-content: flex-start !important;
}
.toolbar.plan-bar2 > .month-row .m-btn {
  flex: 0 0 36px !important; width: 36px !important; min-width: 36px !important; max-width: 36px !important;
}
@media (max-width: 380px) {
  .toolbar.plan-bar2 > .month-row .m-btn {
    flex: 0 0 32px !important; width: 32px !important; min-width: 32px !important; max-width: 32px !important;
    font-size: 12px !important;
  }
}
/* 区间：两个固定宽度的三段组，靠左 */
.toolbar.plan-bar2 > .range-box {
  flex: 0 0 auto !important;
  display: flex !important;
  align-items: center !important;
  gap: 0 !important;
  height: 28px !important;
  padding: 0 5px !important;
  box-sizing: border-box !important;
  border: 1px solid var(--border) !important;
  border-radius: 5px !important;
  background: var(--bg-main) !important;
}
.toolbar.plan-bar2 > .range-box > input {
  flex: 0 0 auto !important;
  height: 26px !important;
  padding: 0 !important;
  margin: 0 !important;
  border: none !important;
  border-radius: 0 !important;
  background: transparent !important;
  color: var(--text-main) !important;
  font-size: 14px !important;
  text-align: center !important;
  outline: none !important;
  box-sizing: border-box !important;
  -webkit-appearance: none !important;
  appearance: none !important;
  box-shadow: none !important;
}
.toolbar.plan-bar2 > .range-box > input.r-y { width: 44px !important; }
.toolbar.plan-bar2 > .range-box > input.r-m,
.toolbar.plan-bar2 > .range-box > input.r-d { width: 28px !important; }
.toolbar.plan-bar2 > .range-box > input.bad { color: var(--danger) !important; }
.toolbar.plan-bar2 > .range-box > input:focus { background: var(--cell-active) !important; border-radius: 3px !important; }
.toolbar.plan-bar2 > .range-box > i {
  flex: 0 0 auto !important;
  font-style: normal !important;
  font-size: 13px !important;
  color: var(--text-light) !important;
  padding: 0 1px !important;
  user-select: none !important;
}
/* 「至」垂直居中对齐 */
.toolbar.plan-bar2 > .tilde {
  flex: 0 0 auto !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  height: 28px !important;
  line-height: 28px !important;
  font-size: 13px !important;
  color: var(--text-muted) !important;
  padding: 0 4px !important;
}
/* 月份格子再窄一点，一行 12 个 */
.toolbar.plan-bar2 > .month-row .m-btn {
  flex: 0 0 31px !important; width: 31px !important; min-width: 31px !important; max-width: 31px !important;
  font-size: 12px !important;
}
/* 区间单框 */
.toolbar.plan-bar2 > input.range-one {
  flex: 0 0 132px !important;
  width: 132px !important;
  min-width: 132px !important;
  max-width: 132px !important;
  height: 28px !important;
  padding: 0 8px !important;
  font-size: 14px !important;
  text-align: center !important;
  box-sizing: border-box !important;
  border: 1px solid var(--border) !important;
  border-radius: 5px !important;
  background: var(--bg-main) !important;
  color: var(--text-main) !important;
}
.toolbar.plan-bar2 > input.range-one:focus { border-color: var(--primary) !important; outline: none !important; }
/* 加载更多：做成明显的一条 */
.flow-more-td {
  padding: 12px 8px !important;
  text-align: center !important;
  font-size: 13px !important;
  color: var(--primary) !important;
  font-weight: 600 !important;
  cursor: pointer !important;
  background: var(--bg-gray) !important;
}
[data-theme="dark"] .flow-more-td { color: #b9a6ff !important; background: var(--bg-gray-light) !important; }
/* 删除按钮不做任何滚动 */
.row-del { scroll-margin: 0 !important; }
/* ============================================================
   Toast 里的「撤销」按钮：浅色 / 深色 各一套
   ============================================================ */
/* 浅色主题：深底白字，按钮白边白字 */
.toast {
  background: rgba(15, 23, 42, .95) !important;
  color: #ffffff !important;
}
.toast > span { color: #ffffff !important; }
.toast > button {
  flex: 0 0 auto !important;
  padding: 4px 12px !important;
  border: 1px solid rgba(255, 255, 255, .55) !important;
  border-radius: 5px !important;
  background: rgba(255, 255, 255, .14) !important;
  color: #ffffff !important;
  font-size: 12px !important;
  font-weight: 700 !important;
  cursor: pointer !important;
  white-space: nowrap !important;
}
.toast > button:active { background: rgba(255, 255, 255, .3) !important; }
.toast.error { background: rgba(185, 28, 28, .96) !important; }
.toast.error > button { border-color: rgba(255,255,255,.6) !important; }

/* 深色主题：更亮的深灰底 + 亮紫字，边框同样亮紫 */
[data-theme="dark"] .toast {
  background: #262626 !important;
  color: #ffffff !important;
  border: 1px solid #3a3a3a !important;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .7) !important;
}
[data-theme="dark"] .toast > span { color: #ffffff !important; }
[data-theme="dark"] .toast > button {
  border: 1px solid #b9a6ff !important;
  background: rgba(185, 166, 255, .16) !important;
  color: #d8ccff !important;
  font-weight: 800 !important;
}
[data-theme="dark"] .toast > button:active { background: rgba(185, 166, 255, .34) !important; color: #ffffff !important; }
[data-theme="dark"] .toast.error { background: #3a1d1d !important; border-color: #6b2b2b !important; }
[data-theme="dark"] .toast.error > button { border-color: #ff9d9d !important; color: #ffc4c4 !important; background: rgba(255,157,157,.14) !important; }
/* ============================================================
   深色主题：工具栏条 + 按钮 = 两级暗紫，做出「半透明玻璃」的层次
   ============================================================ */
[data-theme="dark"] .toolbar.flow-bar,
[data-theme="dark"] .toolbar.bar1,
[data-theme="dark"] .toolbar.bar2,
[data-theme="dark"] .toolbar.install-bar,
[data-theme="dark"] .toolbar.plan-bar,
[data-theme="dark"] .toolbar.plan-bar2 {
  background: #181322 !important;     /* 更深的暗紫：背板 */
  border-bottom: 1px solid #241d33 !important;
}
[data-theme="dark"] .toolbar > button,
[data-theme="dark"] .toolbar.plan-bar > button.plan-btn {
  background: #2a2140 !important;      /* 稍亮的暗紫：按钮填充 */
  border: 1px solid #3b2f59 !important;
  color: #e8e2ff !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05) !important;
}
[data-theme="dark"] .toolbar > button:active,
[data-theme="dark"] .toolbar.plan-bar > button.plan-btn:active {
  background: #382c56 !important;
  border-color: #4d3d75 !important;
}
/* 选中的模式按钮 / 月份格子：亮紫 */
[data-theme="dark"] .toolbar > button[data-active="true"],
[data-theme="dark"] .toolbar .m-btn[data-active="true"],
[data-theme="dark"] .toolbar.plan-bar > button.plan-btn[data-active="true"] {
  background: #4c3d80 !important;
  border-color: #6b5bc4 !important;
  color: #ffffff !important;
  box-shadow: 0 0 0 1px #6b5bc4 inset !important;
}
/* 月份格子也走暗紫 */
[data-theme="dark"] .toolbar .m-btn {
  background: #241d35 !important;
  border: 1px solid #332852 !important;
  color: #d8d2ec !important;
}
[data-theme="dark"] .toolbar .m-btn[data-active="true"] {
  background: #4c3d80 !important;
  border-color: #6b5bc4 !important;
  color: #ffffff !important;
}
/* 输入框跟着暗紫走 */
[data-theme="dark"] .toolbar input,
[data-theme="dark"] .toolbar .range-box,
[data-theme="dark"] .toolbar input.year-input {
  background: #120e1c !important;
  border: 1px solid #332852 !important;
  color: #ffffff !important;
}
[data-theme="dark"] .toolbar input:focus,
[data-theme="dark"] .toolbar .range-box:focus-within {
  border-color: #6b5bc4 !important;
}
/* 按钮文字：垂直居中 + 颜色更接近白 */
.toolbar > button,
.toolbar.plan-bar > button.plan-btn,
.toolbar .m-btn {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  line-height: 1 !important;
  padding-top: 0 !important;
  padding-bottom: 0 !important;
  vertical-align: middle !important;
}
/* 深色下按钮字色：比纯白微紫 */
[data-theme="dark"] .toolbar > button,
[data-theme="dark"] .toolbar.plan-bar > button.plan-btn {
  color: #f2eeff !important;
}
[data-theme="dark"] .toolbar .m-btn {
  color: #eae4fa !important;
}
[data-theme="dark"] .toolbar > button[data-active="true"],
[data-theme="dark"] .toolbar.plan-bar > button.plan-btn[data-active="true"],
[data-theme="dark"] .toolbar .m-btn[data-active="true"] {
  color: #ffffff !important;
}
/* 浅色下也统一居中 */
.toolbar > button.ghost,
.toolbar.plan-bar > button.plan-btn {
  color: var(--text-main) !important;
}
/* 深色主题：按钮不要边框，只靠填充色分层；字比纯白微紫 */
[data-theme="dark"] .toolbar > button,
[data-theme="dark"] .toolbar.plan-bar > button.plan-btn,
[data-theme="dark"] .toolbar .m-btn,
[data-theme="dark"] .toolbar > button.ghost {
  border: none !important;
  box-shadow: none !important;
  color: #f4f1fd !important;
}
[data-theme="dark"] .toolbar > button:active { background: #382c56 !important; border: none !important; }
[data-theme="dark"] .toolbar > button[data-active="true"],
[data-theme="dark"] .toolbar.plan-bar > button.plan-btn[data-active="true"],
[data-theme="dark"] .toolbar .m-btn[data-active="true"] {
  border: none !important;
  box-shadow: none !important;
  color: #ffffff !important;
}
/* ============================================================
   深色：把工具栏之外的按钮也纳入暗紫体系
   （查询页 q-clear、分期页新增/复制、固定页、对话框按钮等）
   ============================================================ */
[data-theme="dark"] button.ghost,
[data-theme="dark"] button.q-clear,
[data-theme="dark"] .query-table button,
[data-theme="dark"] .query-section button,
[data-theme="dark"] .sync-box button,
[data-theme="dark"] .confirm-mask button,
[data-theme="dark"] .inst-bar button,

  justify-content: center !important;
  line-height: 1 !important;
  border-radius: 6px !important;
}
[data-theme="dark"] button.ghost:active,
[data-theme="dark"] button.q-clear:active,
[data-theme="dark"] .query-table button:active,
[data-theme="dark"] .sync-box button:active,

[data-theme="dark"] table.query-table tr.q-title-row,
[data-theme="dark"] table.query-table .q-title-inner {

  border-color: #1e1830 !important;
